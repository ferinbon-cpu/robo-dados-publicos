name: M7 SIOPE WS PUBLIC DISCOVERY GATE
run-name: "M7 SIOPE WS public discovery 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_ws_public_discovery:
        description: "Confirmar discovery público GET-only do WS-SIOPE, sem autenticação ou download"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    if: ${{ inputs.confirm_ws_public_discovery == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_ws_public_discovery_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Discovery público WS-SIOPE ao vivo
        id: live
        continue-on-error: true
        run: python scripts/github_siope_ws_public_discovery_gate.py --output siope-ws-public-discovery-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-ws-public-discovery-${{ github.run_id }}
          path: siope-ws-public-discovery-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do discovery
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
