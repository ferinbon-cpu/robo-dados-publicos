name: M7 SIOPE EXPORT REQUEST REFINEMENT GATE
run-name: "M7 SIOPE export request refinement 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_export_request_refinement:
        description: "Confirmar refinamento passivo das expressões HTTP do export, sem chamar rota/download"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: robo-dados-publicos-siope-export-request-refinement
  cancel-in-progress: false

jobs:
  refine:
    name: Refinar expressão de requisição do export SIOPE
    if: ${{ inputs.confirm_export_request_refinement == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight offline da candidata
        run: python scripts/github_preflight.py

      - name: Dry-run sem rede
        run: python scripts/github_siope_export_request_refinement_gate.py --dry-run

      - name: Compilar
        run: python -m compileall -q .

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest

      - name: Refinamento passivo ao vivo
        id: refinement_gate
        shell: bash
        run: |
          set +e
          python scripts/github_siope_export_request_refinement_gate.py > "$RUNNER_TEMP/siope_export_request_refinement_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-export-request-refinement-evidence
          if [ -s "$RUNNER_TEMP/siope_export_request_refinement_result.json" ]; then
            cp "$RUNNER_TEMP/siope_export_request_refinement_result.json" siope-export-request-refinement-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_EXPORT_REQUEST_REFINEMENT_NO_RESULT","remote_writes":"NONE","candidate_route_requested":false,"artifact_downloaded":false,"head_request_performed":false,"form_submission":false,"browser_automation_performed":false,"click_executed":false,"captcha_bypass":false,"collection_authorized":false,"processing_authorized":false,"recurrence_authorized":false,"schedule_enabled":false}' > siope-export-request-refinement-evidence/result.json
          fi

      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: siope-export-request-refinement-${{ github.run_id }}
          path: siope-export-request-refinement-evidence/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagar resultado do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-export-request-refinement-evidence/result.json
          code='${{ steps.refinement_gate.outputs.exit_code }}'
          if [ "${code:-22}" != "0" ]; then
            exit "${code:-22}"
          fi
          echo "PASS_M7_SIOPE_EXPORT_REQUEST_EXPRESSION_REFINEMENT_GATE"
