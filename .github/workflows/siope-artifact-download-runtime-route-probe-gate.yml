name: M7 SIOPE ARTIFACT DOWNLOAD RUNTIME ROUTE PROBE GATE
run-name: "M7 SIOPE artifact download runtime route probe 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_artifact_download_runtime_route_probe:
        description: "Confirmar probe controlado da rota final de download"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    if: ${{ inputs.confirm_artifact_download_runtime_route_probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-runtime-probe.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_artifact_download_runtime_route_probe_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Probe ao vivo da rota final
        run: python scripts/github_siope_artifact_download_runtime_route_probe_gate.py
