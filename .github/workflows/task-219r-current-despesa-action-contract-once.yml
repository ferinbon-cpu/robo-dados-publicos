name: TASK 219R current-session Despesa action contract once
run-name: "TASK 219R Despesa action contract by @${{ github.actor }}"

on:
  push:
    branches:
      - task-219r-current-despesa-action-contract

permissions:
  contents: read

concurrency:
  group: task-219r-current-despesa-action-contract-once
  cancel-in-progress: false

jobs:
  passive-current-despesa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install Selenium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "selenium==4.35.0"

      - name: Resolve current Despesa and inspect mapped response
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          python - <<'PY'
          import base64, hashlib, html, json, os, re, time, unicodedata
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import parse_qs, urljoin, urlparse
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          START="https://transparencia.limeira.sp.gov.br/tdaportalclient.aspx?418"
          HOST="transparencia.limeira.sp.gov.br"
          ROUTE="/awsgetcontentareas.aspx"
          TARGET_NAME="Despesa"
          TARGET_ORIGIN="2_92_guestuser_207_6_DSL0_VIS1343"
          TERMS=["despesa","empenho","credor","fornecedor","pagamento","liquidacao","liquidação","contrato","processo","pregao","pregão"]

          def ckey(k):
              s=str(k)
              if s.casefold().startswith("gxtpr_"): s=s[6:]
              return re.sub(r"[^a-z0-9]","",s.casefold())

          def field(obj,name,default=None):
              if not isinstance(obj,dict): return default
              want=ckey(name)
              for k,v in obj.items():
                  if ckey(k)==want: return v
              return default

          def decode_jsonish(v,depth=0):
              if depth>3: return v
              if isinstance(v,str):
                  s=v.strip()
                  if s and s[0] in '[{"':
                      try: return decode_jsonish(json.loads(s),depth+1)
                      except Exception: return v
              return v

          def norm(s):
              s=unicodedata.normalize("NFKD",str(s or ""))
              s="".join(c for c in s if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]+"," ",s.casefold()).strip()

          def sha(s):
              return hashlib.sha256(str(s).encode("utf-8",errors="replace")).hexdigest()

          def short(s,n=240):
              if s is None: return None
              s=re.sub(r"\s+"," ",str(s)).strip()
              return s if len(s)<=n else {"length":len(s),"sha256":sha(s)}

          def portal_areas(portal):
              portal=decode_jsonish(portal)
              rows=[]
              layers=field(portal,"Layers",[]) if isinstance(portal,dict) else []
              if not isinstance(layers,list): return rows
              for li,layer in enumerate(layers,1):
                  areas=field(layer,"Areas",[]) if isinstance(layer,dict) else []
                  if not isinstance(areas,list): continue
                  for ai,a in enumerate(areas,1):
                      if not isinstance(a,dict): continue
                      rows.append({
                          "layer_index":li,"area_index":ai,
                          "AreaId":str(field(a,"AreaId","") or ""),
                          "AreaDivId":str(field(a,"AreaDivId","") or ""),
                          "AreaName":str(field(a,"AreaName","") or ""),
                          "AreaOrigin":str(field(a,"AreaOrigin","") or ""),
                          "AreaType":str(field(a,"AreaType","") or "")
                      })
              return rows

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.nodes=[]; self.stack=[]; self.form_index=0; self.current_form=None
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower(); a={str(k).lower():v for k,v in attrs}
                  if tag=="form":
                      self.form_index+=1; self.current_form=self.form_index
                  interesting=tag in {"a","button","form","input","select","textarea"} or "onclick" in a or "href" in a
                  if interesting:
                      self.nodes.append({"tag":tag,"attrs":a,"text_parts":[],"form_index":self.current_form})
                      self.stack.append((tag,len(self.nodes)-1))
              def handle_startendtag(self,tag,attrs):
                  self.handle_starttag(tag,attrs)
                  if self.stack: self.stack.pop()
              def handle_data(self,data):
                  if data.strip():
                      for _,idx in self.stack: self.nodes[idx]["text_parts"].append(data)
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:
                          self.stack=self.stack[:i]; break
                  if tag=="form": self.current_form=None

          def sanitize_node(n,idx):
              attrs={}
              for k in ("id","class","name","type","title","aria-label","href","onclick","role","placeholder","method","action","target","value"):
                  if k not in n["attrs"]: continue
                  if k=="value" and (n["attrs"].get("type") or "").lower()=="hidden": continue
                  attrs[k]=short(n["attrs"][k],240)
              return {"index":idx,"tag":n["tag"],"form_index":n.get("form_index"),"attrs":attrs,"text":short(" ".join(n["text_parts"]),160)}

          def action_from(n):
              a=n["attrs"]; onclick=str(a.get("onclick") or ""); href=str(a.get("href") or "")
              srcs=[onclick]
              if href.lower().startswith("javascript:"): srcs.append(href[len("javascript:"):])
              for src in srcs:
                  m=re.search(r"doPortalAction\s*\(\s*['\"]([^'\"]+)['\"]\s*,\s*['\"]([^'\"]*)['\"]\s*\)",src,re.I)
                  if m: return {"kind":"doPortalAction","action":m.group(1),"parm":m.group(2)}
                  m=re.search(r"doAreaLink\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",src,re.I)
                  if m: return {"kind":"doAreaLink","parm":m.group(1)}
                  m=re.search(r"doLink\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",src,re.I)
                  if m: return {"kind":"doLink","parm":m.group(1)}
              if href and href not in ("#","") and not href.lower().startswith("javascript:"):
                  u=urlparse(urljoin(START,href))
                  if (u.hostname or "").lower()==HOST and u.scheme in ("http","https"):
                      return {"kind":"href","href":href,"path":u.path,"query_keys":sorted(parse_qs(u.query,keep_blank_values=True).keys())}
              if n["tag"]=="form":
                  method=str(a.get("method") or "get").upper()
                  action=str(a.get("action") or "")
                  if action:
                      u=urlparse(urljoin(START,action))
                      if (u.hostname or "").lower()==HOST and u.scheme in ("http","https"):
                          return {"kind":"form","method":method,"action":action,"path":u.path,"query_keys":sorted(parse_qs(u.query,keep_blank_values=True).keys())}
              return None

          def term_counts(s):
              n=norm(s); out={}
              for t in TERMS:
                  nt=norm(t)
                  out[t]=len(re.findall(r"(?<![a-z0-9])"+re.escape(nt)+r"(?![a-z0-9])",n))
              return out

          options=Options()
          for arg in ("--headless=new","--no-sandbox","--disable-dev-shm-usage","--disable-background-networking","--disable-default-apps","--disable-sync","--disable-component-update","--disable-domain-reliability","--metrics-recording-only","--safebrowsing-disable-auto-update","--disable-features=OptimizationHints,MediaRouter","--window-size=1365,900"):
              options.add_argument(arg)
          options.set_capability("goog:loggingPrefs",{"performance":"ALL"})

          out={
              "task":"TASK_219R_CURRENT_DESPESA_ACTION_CONTRACT",
              "issue":725,
              "base_main_sha":"fdd12c6f6406f73f9734209dc55bdf06f2ae12b9",
              "execution_head_sha":os.environ.get("GITHUB_SHA"),
              "boundary":{"browser_sessions":1,"manual_navigations":1,"clicks":0,"typing":0,"form_submissions":0,"manual_fetch_xhr":0,"direct_endpoint_calls":0,"portal_action_triggers":0,"layerinfo_replay":0,"layerinfo_synthesis":0,"retries":0,"commitment_lookup":0,"raw_info_persisted":False,"raw_har_persisted":False},
              "status":"RUNNING"
          }

          driver=None
          try:
              driver=webdriver.Chrome(options=options)
              driver.set_page_load_timeout(35)
              driver.execute_cdp_cmd("Network.enable",{})
              driver.get(START)
              time.sleep(8)

              raw=driver.execute_script("""
                try {
                  const v=gx.fn.getControlValue('vSDT_TDAPORTAL');
                  return {ok:true,json:JSON.stringify(v)};
                } catch(e) { return {ok:false,error:e.name}; }
              """)
              portal=None
              if raw.get("ok"):
                  try: portal=decode_jsonish(json.loads(raw.get("json","null")))
                  except Exception: portal=None
              areas=portal_areas(portal)
              targets=[a for a in areas if a["AreaName"]==TARGET_NAME and a["AreaOrigin"]==TARGET_ORIGIN]
              out["state"]={"portal_read":portal is not None,"area_count":len(areas),"target_match_count":len(targets),"areas":[{"AreaName":a["AreaName"],"AreaOrigin":a["AreaOrigin"],"AreaId":a["AreaId"],"AreaType":a["AreaType"]} for a in areas]}

              if len(targets)!=1:
                  out["status"]="STOP_DESPESA_STATE_NOT_UNIQUE"
                  raise SystemExit
              target=targets[0]
              current_id=target["AreaId"]
              out["current_despesa"]={**target,"same_session_selector":True}

              logs=driver.get_log("performance")
              reqs=[]; response_received={}
              for e in logs:
                  try: m=json.loads(e["message"])["message"]
                  except Exception: continue
                  p=m.get("params") or {}
                  if m.get("method")=="Network.requestWillBeSent":
                      req=p.get("request") or {}; u=urlparse(req.get("url") or "")
                      if (u.hostname or "").lower()==HOST and u.path==ROUTE and (req.get("method") or "").upper()=="POST":
                          reqs.append({"requestId":p.get("requestId"),"postData":req.get("postData") or ""})
                  elif m.get("method")=="Network.responseReceived":
                      response_received[p.get("requestId")]=p.get("response") or {}

              matches=[]
              for ordinal,ev in enumerate(reqs,1):
                  form=parse_qs(ev["postData"],keep_blank_values=True)
                  vals=form.get("LayerInfo",[])
                  if len(vals)!=1: continue
                  try:
                      arr=json.loads(vals[0])
                      req_obj=arr[0] if isinstance(arr,list) and len(arr)==1 and isinstance(arr[0],dict) else None
                  except Exception: req_obj=None
                  if not req_obj or str(req_obj.get("id") or "")!=current_id: continue
                  resp_obj=None
                  try:
                      b=driver.execute_cdp_cmd("Network.getResponseBody",{"requestId":ev["requestId"]})
                      bb=base64.b64decode(b["body"]) if b.get("base64Encoded") else b.get("body","").encode("utf-8")
                      arr=json.loads(bb.decode("utf-8"))
                      resp_obj=arr[0] if isinstance(arr,list) and len(arr)==1 and isinstance(arr[0],dict) else None
                  except Exception: resp_obj=None
                  matches.append({"ordinal":ordinal,"requestId":ev["requestId"],"request_obj":req_obj,"response_obj":resp_obj})

              out["automatic_binding"]={"automatic_request_count":len(reqs),"same_session_request_match_count":len(matches)}

              if len(matches)!=1:
                  out["status"]="STOP_DESPESA_LAYERINFO_NOT_UNIQUE"
                  raise SystemExit

              m=matches[0]; req_obj=m["request_obj"]; resp_obj=m["response_obj"]
              if not isinstance(resp_obj,dict) or str(resp_obj.get("id") or "")!=current_id:
                  out["status"]="STOP_DESPESA_RESPONSE_ID_MISMATCH"
                  raise SystemExit

              info=resp_obj.get("info")
              if not isinstance(info,str):
                  out["status"]="STOP_DESPESA_INFO_NOT_TEXT"
                  raise SystemExit

              decoded=html.unescape(info)
              p=Parser(); p.feed(decoded)
              nodes=[sanitize_node(n,i) for i,n in enumerate(p.nodes,1)]
              actions=[]; seen=set()
              for i,n in enumerate(p.nodes,1):
                  a=action_from(n)
                  if not a: continue
                  key=json.dumps(a,ensure_ascii=False,sort_keys=True)
                  if key in seen: continue
                  seen.add(key)
                  actions.append({"node_index":i,"action":a,"node":sanitize_node(n,i)})

              out["selected_response"]={
                  "request_ordinal":m["ordinal"],
                  "request_layerinfo_id":str(req_obj.get("id") or ""),
                  "response_layerinfo_id":str(resp_obj.get("id") or ""),
                  "request_response_id_equal":str(req_obj.get("id") or "")==str(resp_obj.get("id") or ""),
                  "raw_info_persisted":False,
                  "raw_info_length":len(info),
                  "raw_info_sha256":sha(info),
                  "decoded_info_length":len(decoded),
                  "decoded_info_sha256":sha(decoded),
                  "accounting_term_counts":term_counts(decoded),
                  "interactive_node_count":len(nodes),
                  "interactive_nodes":nodes[:300],
                  "official_action_count":len(actions),
                  "official_actions":actions[:100],
                  "unique_official_action":len(actions)==1
              }
              out["adjudication"]={
                  "current_session_despesa_binding_proven":True,
                  "official_action_contract_proven":len(actions)==1,
                  "official_action_contract":actions[0]["action"] if len(actions)==1 else None,
                  "official_action_ambiguous":len(actions)>1,
                  "official_action_absent":len(actions)==0
              }
              out["status"]="PASS_TASK219R_CURRENT_DESPESA_ACTION_CONTRACT"
          except SystemExit:
              pass
          except Exception as exc:
              out["status"]="STOP_TASK219R_RUNTIME"
              out["error_type"]=type(exc).__name__
              out["error_message"]=short(str(exc),240)
          finally:
              if driver:
                  try: driver.quit()
                  except Exception: pass

          Path("runtime/task219r_result.json").write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({
              "status":out["status"],
              "current_despesa":out.get("current_despesa"),
              "automatic_binding":out.get("automatic_binding"),
              "selected_response":out.get("selected_response"),
              "adjudication":out.get("adjudication")
          },ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload sanitized action-contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-219r-current-despesa-action-evidence
          path: runtime/task219r_result.json
          if-no-files-found: error
          retention-days: 1
