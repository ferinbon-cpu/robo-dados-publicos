name: DeepSeek automatic PR review

on:
  workflow_run:
    workflows:
      - "CI offline 0.8.0 candidate M7"
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Review PR with DeepSeek read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/deepseek_pr_review_auto.py \
            --repository "${GITHUB_REPOSITORY}" \
            --pr-number "${{ github.event.workflow_run.pull_requests[0].number }}" \
            --expected-head-sha "${{ github.event.workflow_run.head_sha }}" \
            --upstream-conclusion "${{ github.event.workflow_run.conclusion }}" \
            --model "deepseek-v4-flash"

      - name: Publish review and telemetry to job summary
        if: always()
        run: |
          if [[ -f runtime/deepseek_auto_review.md ]]; then
            cat runtime/deepseek_auto_review.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f runtime/deepseek_auto_review_summary.json ]]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat runtime/deepseek_auto_review_summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
