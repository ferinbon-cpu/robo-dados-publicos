name: TASK 185 TCE real accounting one-shot live gate

on:
  push:
    branches:
      - task-185-stage-b-live-one-shot
    paths:
      - docs/evidence/TASK_185_STAGE_B_OWNER_AUTHORIZATION_0.8.0.json

permissions:
  contents: read

concurrency:
  group: task-185-tce-real-accounting-one-shot
  cancel-in-progress: false

jobs:
  live:
    if: github.actor == 'ferinbon-cpu' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
    steps:
      - name: Checkout exact authorization commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify one-shot authorization commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/task-185-stage-b-live-one-shot"
          IMPLEMENTATION_SHA="$(python -c 'import json; print(json.load(open("docs/evidence/TASK_185_STAGE_B_OWNER_AUTHORIZATION_0.8.0.json", encoding="utf-8"))["implementation_sha"])')"
          test "$(git rev-parse HEAD^)" = "$IMPLEMENTATION_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = "docs/evidence/TASK_185_STAGE_B_OWNER_AUTHORIZATION_0.8.0.json"
          echo "TASK185_IMPLEMENTATION_SHA=$IMPLEMENTATION_SHA" >> "$GITHUB_ENV"

      - name: Verify OAuth secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_DRIVE_CLIENT_ID"
          test -n "$GOOGLE_DRIVE_CLIENT_SECRET"
          test -n "$GOOGLE_DRIVE_REFRESH_TOKEN"

      - name: Offline preflight before source network
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q robo_dados_publicos scripts tests
          python -m unittest tests.test_task_185_accounting_persistence tests.test_task_185_live_gate_offline -v

      - name: Execute bounded source GET, create-only custody and offline Stage C
        shell: bash
        run: |
          set -euo pipefail
          python scripts/task185_live_accounting_gate.py \
            --implementation-sha "$TASK185_IMPLEMENTATION_SHA" \
            --generated-at "2026-09-06T09:15:00-03:00" \
            --software-version "0.8.0"

      - name: Upload sanitized result and derived ledger artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task185-live-result
          path: task185-live-output/
          if-no-files-found: error
          retention-days: 30
