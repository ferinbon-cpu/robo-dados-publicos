name: TASK 086 bounded next contract query live once
run-name: "TASK 086 one bounded municipal contract query by @${{ github.actor }}"

on:
  push:
    branches:
      - task-086-next-contract-bounded-query

permissions:
  contents: read

concurrency:
  group: task-086-contract-resolver-live-once
  cancel-in-progress: false

jobs:
  bounded-readonly-query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false

      - name: Execute exactly one bounded read-only stateful query
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          from robo_dados_publicos.reconciliation.resolvers import LimeiraContractsResolver

          ALLOWED_HOST = "serv42.limeira.sp.gov.br"
          MAX_REQUESTS = 3
          task = {
              "task_id": "RECTASK_6600049d5284824e9a0a44a6",
              "target_source": "LIMEIRA_CONTRATOS",
              "task_type": "FIND_CONTRACT_RECORD",
              "status": "READY_SEARCH",
              "match_keys": {
                  "year": 2024,
                  "contract_number": "170/2024",
                  "cnpj": "51656458000134",
                  "contractor": "Consil Sistema Prevenção Contra Incêndio Ltda",
              },
              "search_hints": {
                  "process_number": "900.711/2025",
                  "object_text": "Contratação de empresa especializada em adequações das instalações elétricas e do sistema de segurança e combate contra incêndio da Emeief Pastor Ismael Pereira do Lago",
              },
          }

          class BoundedResolver(LimeiraContractsResolver):
              def __init__(self):
                  super().__init__()
                  self.request_log = []

              def _request(self, url, *, method="GET", params=None):
                  if len(self.request_log) >= MAX_REQUESTS:
                      raise RuntimeError("STOP_TASK086_HTTP_BUDGET_EXCEEDED")
                  parsed = urlparse(url)
                  host = (parsed.hostname or "").lower()
                  if host != ALLOWED_HOST:
                      raise RuntimeError("STOP_TASK086_ORIGIN_OUTSIDE_ALLOWLIST")
                  self.request_log.append({
                      "ordinal": len(self.request_log) + 1,
                      "method": method.upper(),
                      "host": host,
                      "path": parsed.path,
                      "submitted_field_names": sorted((params or {}).keys()),
                  })
                  return super()._request(url, method=method, params=params)

          resolver = BoundedResolver()
          out = {
              "task": "TASK_086_BOUNDED_NEXT_CONTRACT_QUERY",
              "base_main_sha": "44ed6cf24100317bce62252f03eeb0b1b6ab3995",
              "pre_run_task_contract_sha": "6ce5e4b9cc8f7c20d18f383a67ae82d2993e84ec",
              "selected_task_id": task["task_id"],
              "max_http_requests": MAX_REQUESTS,
              "hard_boundaries": {
                  "drive_reads": 0,
                  "drive_writes": 0,
                  "state_registry_writes": 0,
                  "queue_writes": 0,
                  "serving_writes": 0,
                  "publications": 0,
                  "contract_identity_assertions": 0,
                  "financial_identity_assertions": 0,
              },
          }
          try:
              result = resolver.resolve(task)
              payload = result.to_dict()
              allowed = {
                  "MATCH_CANDIDATE",
                  "NO_MATCH",
                  "STOP_CONTRACT_FORM_UNPROVEN",
                  "STOP_MISSING_CONTRACT_OR_SUPPLIER_KEY",
                  "STOP_CONTRACT_RELAY_ORIGIN_UNPROVEN",
                  "STOP_CONTRACT_RESULT_SCHEMA_UNPROVEN",
              }
              if payload["status"] not in allowed:
                  raise RuntimeError("STOP_TASK086_UNEXPECTED_RESOLVER_STATUS")
              out["resolver_result"] = payload
              out["result"] = "PASS_TASK086_BOUNDED_REMOTE_EXECUTION_RECORDED"
          except Exception as exc:
              out["resolver_result"] = {
                  "status": "STOP_TASK086_REMOTE_EXECUTION",
                  "error_type": type(exc).__name__,
                  "error": str(exc)[:500],
                  "candidates": [],
              }
              out["result"] = "STOP_TASK086_REMOTE_EXECUTION_RECORDED"

          out["request_count"] = len(resolver.request_log)
          out["requests"] = resolver.request_log
          if out["request_count"] > MAX_REQUESTS:
              raise SystemExit("STOP_TASK086_HTTP_BUDGET_EXCEEDED")

          candidate_summaries = []
          for candidate in out["resolver_result"].get("candidates") or []:
              canonical = json.dumps(candidate, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              candidate_summaries.append({
                  "sha256": hashlib.sha256(canonical.encode("utf-8")).hexdigest(),
                  "match_signals": candidate.get("match_signals") or [],
              })
          out["candidate_summaries"] = candidate_summaries

          target = Path("runtime/task086_result.json")
          target.write_text(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          canonical = json.dumps(out, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n"
          print(json.dumps({
              "result": out["result"],
              "resolver_status": out["resolver_result"]["status"],
              "candidate_count": len(out["resolver_result"].get("candidates") or []),
              "candidate_summaries": candidate_summaries,
              "request_count": out["request_count"],
              "canonical_sha256": hashlib.sha256(canonical.encode("utf-8")).hexdigest(),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload sanitized bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-086-bounded-contract-resolver-evidence
          path: runtime/task086_result.json
          if-no-files-found: error
          retention-days: 1
