name: M7 SIOPE PUBLIC GET RUNTIME ROUTE DIAGNOSTICS GATE
run-name: "M7 SIOPE public GET runtime route diagnostics 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_public_get_runtime_route_diagnostics:
        description: "Confirmar GET público indexado + assets estáticos oficiais; bloquear antes da rede toda rota dinâmica observada"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.confirm_public_get_runtime_route_diagnostics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_siope_runtime_dependency_preflight.py
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_public_get_runtime_route_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Diagnosticar rotas runtime do GET público SIOPE
        id: live
        continue-on-error: true
        run: python scripts/github_siope_public_get_runtime_route_diagnostics_gate.py --output siope-public-get-runtime-route-diagnostics-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-public-get-runtime-route-diagnostics-${{ github.run_id }}
          path: siope-public-get-runtime-route-diagnostics-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
