name: DIAG latest DOM syntax manual run
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest exact manual run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: 0f51509fdc7c1f3192e10ae638a216055eb3bcad
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; expected=os.environ['EXPECTED_SHA']
          wf='siope-official-olinda-api-application-dom-syntax-skeleton-diagnostics-gate.yml'
          def get(url):
              req=urllib.request.Request(url, headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r: return json.load(r)
          runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch=main&event=workflow_dispatch&per_page=3')['workflow_runs']
          assert runs, 'NO_MANUAL_RUN_FOUND'
          run=runs[0]
          jobs=get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?filter=latest")['jobs']
          arts=get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts")['artifacts']
          out={
            'run_id':run['id'],'run_number':run['run_number'],'event':run['event'],'head_branch':run['head_branch'],
            'head_sha':run['head_sha'],'status':run['status'],'conclusion':run['conclusion'],'created_at':run['created_at'],'updated_at':run['updated_at'],
            'jobs':[{'job_id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'steps':[{'name':s['name'],'status':s['status'],'conclusion':s['conclusion'],'number':s['number']} for s in j.get('steps',[])]} for j in jobs],
            'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'expired':a['expired'],'digest':a.get('digest')} for a in arts]
          }
          print(json.dumps(out, ensure_ascii=False, sort_keys=True, indent=2))
          assert run['event']=='workflow_dispatch'
          assert run['head_branch']=='main'
          assert run['head_sha']==expected, f"UNEXPECTED_HEAD_SHA:{run['head_sha']}"
          assert run['status']=='completed'
          PY
