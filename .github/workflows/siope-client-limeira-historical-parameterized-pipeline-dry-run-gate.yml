name: M7 SIOPE CLIENT LIMEIRA HISTORICAL PARAMETERIZED PIPELINE DRY RUN GATE
run-name: "M7 SIOPE historical parameterized pipeline dry-run 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_historical_parameterized_pipeline_dry_run:
        description: "Confirmar dry-run/equivalência offline do pipeline parametrizado; sem GET, Drive, mutação, lote live, retry, paginação ou schedule"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-client-limeira-historical-parameterized-pipeline-dry-run
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirm_siope_client_limeira_historical_parameterized_pipeline_dry_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Executar dry-run e equivalência parametrizada sem rede
        run: python scripts/github_siope_client_limeira_historical_parameterized_pipeline_dry_run_gate.py
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Publicar resultado do dry-run
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-client-limeira-historical-parameterized-pipeline-dry-run-${{ github.run_id }}
          path: siope-client-limeira-historical-parameterized-pipeline-dry-run-evidence/result.json
          if-no-files-found: error
          retention-days: 30
