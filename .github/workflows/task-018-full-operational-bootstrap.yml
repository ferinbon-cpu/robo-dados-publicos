name: TASK 018 full bounded operational bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-018-full-operational-bootstrap
  cancel-in-progress: false

jobs:
  T1_DISCOVER_AND_COLLECT:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/github_task_018_full_operational_bootstrap_design_gate.py
      - run: python scripts/github_task_018_full_operational_bootstrap.py --stage T1_DISCOVER_AND_COLLECT

  T2_CREATE_ONLY_PERSIST_AND_PROCESS:
    needs: T1_DISCOVER_AND_COLLECT
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: task-018-owner-authorized-create-only
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python scripts/github_task_018_full_operational_bootstrap.py --stage T2_CREATE_ONLY_PERSIST_AND_PROCESS
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

  T3_CREATE_ONLY_PRODUCT_PUBLICATION:
    needs: T2_CREATE_ONLY_PERSIST_AND_PROCESS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: task-018-owner-authorized-publication
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python scripts/github_task_018_full_operational_bootstrap.py --stage T3_CREATE_ONLY_PRODUCT_PUBLICATION
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task-018-sanitized-operational-evidence
          path: task-018-audit/
          if-no-files-found: error
          retention-days: 30
