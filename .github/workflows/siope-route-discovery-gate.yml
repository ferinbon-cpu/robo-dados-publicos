name: M7 SIOPE ROUTE DISCOVERY GATE
run-name: "M7 SIOPE route discovery 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_route_discovery:
        description: "Confirmar descoberta passiva: somente GET em 2 superfícies oficiais FNDE, sem download de dataset"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: robo-dados-publicos-siope-route-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Descobrir rota SIOPE
    if: ${{ inputs.confirm_route_discovery == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight offline da candidata
        run: python scripts/github_preflight.py

      - name: Dry-run da descoberta sem rede
        run: python scripts/github_siope_route_discovery_gate.py --dry-run

      - name: Compilar
        run: python -m compileall -q .

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest

      - name: Descoberta passiva ao vivo
        id: route_gate
        shell: bash
        run: |
          set +e
          python scripts/github_siope_route_discovery_gate.py > "$RUNNER_TEMP/siope_route_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-route-evidence
          if [ -s "$RUNNER_TEMP/siope_route_result.json" ]; then
            cp "$RUNNER_TEMP/siope_route_result.json" siope-route-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_ROUTE_DISCOVERY_NO_RESULT","remote_writes":"NONE","form_submission":false,"captcha_bypass":false,"artifact_downloaded":false,"collection_authorized":false,"recurrence_authorized":false,"schedule_enabled":false}' > siope-route-evidence/result.json
          fi

      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: siope-route-discovery-${{ github.run_id }}
          path: siope-route-evidence/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagar resultado do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-route-evidence/result.json
          code='${{ steps.route_gate.outputs.exit_code }}'
          if [ "${code:-18}" != "0" ]; then
            exit "${code:-18}"
          fi
          echo "PASS_M7_SIOPE_ROUTE_DISCOVERY_GATE"
