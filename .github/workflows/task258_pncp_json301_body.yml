name: TASK 258 PNCP bounded JSON 301 body inspection
on:
 push:
  branches: [task-258-pncp-json301-body-runtime]
  paths: ['runtime_triggers/task258_pncp_json301_body.run']
permissions: {contents: read}
jobs:
 inspect:
  runs-on: ubuntu-24.04
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     with: {persist-credentials: false, fetch-depth: 0}
   - name: Validate token-3 delta
     run: |
      set -euo pipefail
      test "${GITHUB_RUN_ATTEMPT}" = "1"
      IMPL="$(python -c 'import json;print(json.load(open("runtime/task258_owner_authorization.json"))["implementation_sha"])')"
      git cat-file -e "$IMPL^{commit}"; git merge-base --is-ancestor "$IMPL" HEAD
      test -z "$(git diff --name-only "$IMPL"..HEAD | grep -Ev '^(runtime/task258_owner_authorization.json|runtime_triggers/task258_pncp_json301_body.run)$' || true)"
      echo "TASK258_IMPLEMENTATION_SHA=$IMPL" >> "$GITHUB_ENV"
   - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
     with: {python-version: '3.12'}
   - name: Execute token-3 bounded body inspection
     run: |
      set -euo pipefail; mkdir -p runtime_out
      python - <<'PY'
      import hashlib,json,os
      from pathlib import Path
      from robo_dados_publicos.research.task258_task257_json301_body import *
      c=load_config();e=load_evidence();a=json.loads(Path("runtime/task258_owner_authorization.json").read_text())
      r=execute(c,e,transport=CurlBodyTransport(),authorization=a,expected_implementation_sha=os.environ["TASK258_IMPLEMENTATION_SHA"])
      z=json.dumps(r,sort_keys=True,separators=(",",":")).encode();r["result_sha256"]=hashlib.sha256(z).hexdigest()
      Path("runtime_out/task258_sanitized_result.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
      print("TASK258_STATUS="+str(r.get("status")));print("TASK258_OUTCOME="+str(r.get("outcome")))
      print("TASK258_HTTP="+str(r.get("http_code")));print("TASK258_BYTES="+str(r.get("body_bytes")));print("TASK258_PROJECTION="+json.dumps(r.get("json_projection"),ensure_ascii=False))
      PY
   - name: Verify no raw body
     run: |
      set -euo pipefail
      test "$(find runtime_out -maxdepth 1 -type f -printf '%f\n')" = "task258_sanitized_result.json"
      test -z "$(find . -maxdepth 2 -type f -name 't258_*.body' -print)"
   - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
     with: {name: task-258-pncp-json301-body-sanitized, path: runtime_out/task258_sanitized_result.json, retention-days: 1, if-no-files-found: error}
