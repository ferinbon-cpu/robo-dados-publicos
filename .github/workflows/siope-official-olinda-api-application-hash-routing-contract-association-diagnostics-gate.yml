name: M7 SIOPE OFFICIAL OLINDA APPLICATION HASH ROUTING CONTRACT ASSOCIATION DIAGNOSTICS GATE
run-name: "M7 SIOPE official Olinda application hash routing contract association diagnostics 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_official_olinda_application_hash_routing_contract_association_diagnostics:
        description: "Confirmar cruzamento passivo entre famílias de hash-routing e tokens OData; sem fragment value, navegação ou recurso"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.confirm_official_olinda_application_hash_routing_contract_association_diagnostics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_siope_official_olinda_api_application_hash_routing_family_intersection_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_hash_routing_contract_association_diagnostics_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_hash_routing_contract_association_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Diagnosticar associação entre famílias de hash-routing e contrato OData
        id: live
        continue-on-error: true
        run: python scripts/github_siope_official_olinda_api_application_hash_routing_contract_association_diagnostics_gate.py --output siope-official-olinda-application-hash-routing-contract-association-diagnostics-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: siope-official-olinda-application-hash-routing-contract-association-diagnostics-${{ github.run_id }}
          path: siope-official-olinda-application-hash-routing-contract-association-diagnostics-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
