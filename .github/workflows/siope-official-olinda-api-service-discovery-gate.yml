name: M7 SIOPE OFFICIAL OLINDA API SERVICE DISCOVERY GATE
run-name: "M7 SIOPE official Olinda API service discovery 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_official_olinda_api_service_discovery:
        description: "Confirmar 1 GET somente à raiz oficial OData SIOPE, sem query, município, ano, links ou coleta"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    if: ${{ inputs.confirm_official_olinda_api_service_discovery == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_public_runtime_route_contract_review_gate.py
      - run: python scripts/github_siope_public_runtime_query_equivalence_partition_design_gate.py
      - run: python scripts/github_siope_public_indexed_get_second_example_discovery_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_discovery_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_service_discovery_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Descobrir catálogo raiz oficial Olinda SIOPE
        id: live
        continue-on-error: true
        run: python scripts/github_siope_official_olinda_api_service_discovery_gate.py --output siope-official-olinda-api-service-discovery-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: siope-official-olinda-api-service-discovery-${{ github.run_id }}
          path: siope-official-olinda-api-service-discovery-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
