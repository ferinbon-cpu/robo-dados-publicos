name: TASK 265 PNCP documented ITEMS route probe 645
on:
 push:
  branches: [task-265-pncp-items-route-probe-645-runtime]
  paths: ['runtime_triggers/task265_pncp_items_route_probe_645.run']
permissions: {contents: read}
jobs:
 probe:
  runs-on: ubuntu-24.04
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
     with: {persist-credentials: false, fetch-depth: 0}
   - name: Validate token-9 delta
     run: |
      set -euo pipefail;test "${GITHUB_RUN_ATTEMPT}" = "1"
      IMPL="$(python -c 'import json;print(json.load(open("runtime/task265_owner_authorization.json"))["implementation_sha"])')"
      git cat-file -e "$IMPL^{commit}";git merge-base --is-ancestor "$IMPL" HEAD
      test -z "$(git diff --name-only "$IMPL"..HEAD | grep -Ev '^(runtime/task265_owner_authorization.json|runtime_triggers/task265_pncp_items_route_probe_645.run)$' || true)"
      echo "TASK265_IMPLEMENTATION_SHA=$IMPL" >> "$GITHUB_ENV"
   - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
     with: {python-version: '3.12'}
   - name: Execute token-9 single documented ITEMS probe
     run: |
      set -euo pipefail;mkdir -p runtime_out
      python - <<'PY'
      import hashlib,json,os
      from pathlib import Path
      from robo_dados_publicos.research.task265_pncp_items_route_probe_645 import *
      c=load_config();e=load_evidence();a=json.loads(Path("runtime/task265_owner_authorization.json").read_text())
      r=execute(c,e,authorization=a,expected_implementation_sha=os.environ["TASK265_IMPLEMENTATION_SHA"])
      z=json.dumps(r,sort_keys=True,separators=(",",":")).encode();r["result_sha256"]=hashlib.sha256(z).hexdigest()
      Path("runtime_out/task265_sanitized_result.json").write_text(json.dumps(r,indent=2,ensure_ascii=False,sort_keys=True)+"\n")
      print("TASK265_STATUS="+str(r.get("status")));print("TASK265_OUTCOME="+str(r.get("outcome")));print("TASK265_HTTP="+str(r.get("http_code")));print("TASK265_SHAPE="+str(r.get("json_shape")));print("TASK265_ITEM_COUNT="+str(r.get("item_count")));print("TASK265_DIAG="+str(r.get("diagnostic_scalars")))
      PY
   - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
     with: {name: task-265-pncp-items-route-probe-645-sanitized, path: runtime_out/task265_sanitized_result.json, retention-days: 1, if-no-files-found: error}
