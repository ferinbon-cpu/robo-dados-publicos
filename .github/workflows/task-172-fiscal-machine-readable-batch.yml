name: TASK 172 fiscal machine-readable bounded live batch

on:
  push:
    branches:
      - task-172-fiscal-machine-readable-batch
    paths:
      - config/task172_live_trigger.v1.json

permissions:
  contents: read

jobs:
  bounded-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate pinned offline contract
        run: |
          python - <<'PY'
          from robo_dados_publicos.research.task172_fiscal_machine_readable_batch import validate_contract
          result = validate_contract()
          assert result["status"] == "PASS"
          assert result["max_requests"] == 13
          assert result["source_count"] == 12
          print(result)
          PY

      - name: Execute exact bounded read-only batch
        run: |
          python -m robo_dados_publicos.research.task172_fiscal_machine_readable_batch > task172_sanitized_result.json

      - name: Validate sanitized result boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("task172_sanitized_result.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          assert obj["schema"] == "TASK172_SANITIZED_RESULT_V1"
          assert obj["raw_payload_persisted"] is False
          assert obj["policy_identity_promoted"] is False
          assert obj["financial_identity_promoted"] is False
          assert obj["payment_promoted"] is False
          assert 12 <= obj["request_count"] <= 13
          assert len(obj["results"]) in (12, 13)
          print(json.dumps({
              "schema": obj["schema"],
              "request_count": obj["request_count"],
              "result_sha256": obj["result_sha256"],
              "statuses": {r["source_id"]: r["status"] for r in obj["results"]},
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@v4
        with:
          name: task172-sanitized-result
          path: task172_sanitized_result.json
          if-no-files-found: error
          retention-days: 7
