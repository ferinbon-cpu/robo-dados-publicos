name: ROBO DADOS PUBLICOS
run-name: "M4E active 0.6.1 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_persistence:
        description: "Confirmar escrita controlada em 06_BANCOS e log append-only em 07_LOGS"
        required: true
        default: false
        type: boolean

# O agendamento permanece desativado até decisão explícita sobre cadência e fontes.
# Exemplo (não ativo):
#  schedule:
#    - cron: '17 3 * * *'
#      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: robo-dados-publicos-production
  cancel-in-progress: false

jobs:
  run:
    name: Executar robô
    if: ${{ inputs.confirm_persistence == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROBO_DRIVE_AUTH: oauth-env
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validar ausência de segredos obrigatórios
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          names = (
              'GOOGLE_DRIVE_CLIENT_ID',
              'GOOGLE_DRIVE_CLIENT_SECRET',
              'GOOGLE_DRIVE_REFRESH_TOKEN',
          )
          missing = [name for name in names if not os.getenv(name, '').strip()]
          if missing:
              print('STOP_MISSING_GITHUB_SECRETS: ' + ', '.join(missing))
              sys.exit(3)
          print('OAuth secrets: PRESENTES (valores não exibidos)')
          PY

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight da release ativa e do workflow
        run: python scripts/github_preflight.py --require-oauth

      - name: Compilar
        run: python -m compileall -q .

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest

      - name: Execução persistente de infraestrutura
        run: python scripts/github_run_gate.py
