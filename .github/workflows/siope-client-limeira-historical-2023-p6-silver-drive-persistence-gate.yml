name: M7 SIOPE CLIENT LIMEIRA HISTORICAL 2023 P6 SILVER DRIVE PERSISTENCE GATE
run-name: "M7 SIOPE client Limeira historical 2023 P6 Silver Drive persistence 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_historical_2023_p6_silver_drive_persistence:
        description: "Confirmar criação única do Silver histórico 2023/P6 em 02_SILVER; sem novo GET SIOPE, sem overwrite/delete/replace, sem Gold, lote ou recorrência"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-client-limeira-historical-2023-p6-silver-drive-persistence
  cancel-in-progress: false

jobs:
  persist:
    if: ${{ inputs.confirm_siope_client_limeira_historical_2023_p6_silver_drive_persistence == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Revisar preview Silver histórico 2023 P6 pinado
        run: python scripts/github_siope_client_limeira_historical_2023_p6_silver_single_record_transform_review_gate.py
      - name: Validar desenho de persistência Silver histórica sem rede nem writes
        run: python scripts/github_siope_client_limeira_historical_2023_p6_silver_drive_persistence_gate.py --dry-run
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Verificar secrets OAuth Drive
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          test -n "$GOOGLE_DRIVE_CLIENT_ID"
          test -n "$GOOGLE_DRIVE_CLIENT_SECRET"
          test -n "$GOOGLE_DRIVE_REFRESH_TOKEN"
      - name: Persistir exatamente um payload histórico validado no 02_SILVER
        id: persist
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set +e
          python scripts/github_siope_client_limeira_historical_2023_p6_silver_drive_persistence_gate.py > "$RUNNER_TEMP/siope_historical_2023_p6_silver_drive_persistence_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-client-limeira-historical-2023-p6-silver-drive-persistence-evidence
          if [ -s "$RUNNER_TEMP/siope_historical_2023_p6_silver_drive_persistence_result.json" ]; then
            cp "$RUNNER_TEMP/siope_historical_2023_p6_silver_drive_persistence_result.json" siope-client-limeira-historical-2023-p6-silver-drive-persistence-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_CLIENT_LIMEIRA_HISTORICAL_2023_P6_SILVER_DRIVE_PERSISTENCE_NO_RESULT","drive_write_count":0,"silver_payload_persisted":false,"source_network_called":false,"historical_collection_authorized":false,"gold_authorized":false}' > siope-client-limeira-historical-2023-p6-silver-drive-persistence-evidence/result.json
          fi
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-client-limeira-historical-2023-p6-silver-drive-persistence-${{ github.run_id }}
          path: siope-client-limeira-historical-2023-p6-silver-drive-persistence-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-client-limeira-historical-2023-p6-silver-drive-persistence-evidence/result.json
          code='${{ steps.persist.outputs.exit_code }}'
          if [ "${code:-28}" != "0" ]; then
            exit "${code:-28}"
          fi
          echo "PASS_M7_SIOPE_CLIENT_LIMEIRA_HISTORICAL_2023_P6_SILVER_DRIVE_PERSISTENCE"
