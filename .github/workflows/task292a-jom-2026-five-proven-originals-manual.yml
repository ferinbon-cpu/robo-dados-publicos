      - name: Guardar JOM 7324 parte 03
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task292a-jom-7324-part03
          path: task292a_files/pieces/7324/part03/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Rejeitar lote parcial e confirmar política de zero Drive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("task292a_files/manifest.json")
          if not p.is_file():
              raise SystemExit("STOP_292A_NO_MANIFEST")
          d=json.loads(p.read_text("utf-8"))
          if (d.get("status") != "PASS_5_VALIDATED" or d.get("validated_count") != 5
                  or d.get("failed_count") != 0 or d.get("source_get_attempts") != 5
                  or d.get("retry_count") != 0 or d.get("index_get_count") != 0
                  or d.get("drive_write_count") != 0):
              raise SystemExit("STOP_292A_PARTIAL_REVIEW_ARTIFACTS")
          print("PASS_TASK292A_5_CANONICAL_PDF_ORIGINALS")
          PY
