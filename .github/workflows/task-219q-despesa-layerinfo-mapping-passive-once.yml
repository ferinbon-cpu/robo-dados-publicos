name: TASK 219Q passive SDT to LayerInfo mapping once
run-name: "TASK 219Q exact passive mapping by @${{ github.actor }}"

on:
  push:
    branches:
      - task-219q-despesa-layerinfo-mapping-passive

permissions:
  contents: read

concurrency:
  group: task-219q-despesa-layerinfo-mapping-passive-once
  cancel-in-progress: false

jobs:
  passive-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install Selenium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "selenium==4.35.0"

      - name: Capture exact passive identifier mapping
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          python - <<'PY'
          import base64
          import hashlib
          import html
          import json
          import os
          import re
          import time
          import unicodedata
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import parse_qs, urljoin, urlparse

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          START="https://transparencia.limeira.sp.gov.br/tdaportalclient.aspx?418"
          HOST="transparencia.limeira.sp.gov.br"
          ROUTE="/awsgetcontentareas.aspx"
          DESPESA_AREA_ID="0e1483cd46954696a3e9b01c5be19e23DSA6"
          DESPESA_ORIGIN="2_92_guestuser_207_6_DSL0_VIS1343"

          ACCOUNTING_TERMS=[
              "despesa","empenho","credor","fornecedor","pagamento",
              "liquidacao","liquidação","processo","pregao","pregão","contrato"
          ]

          def canonical_key(k):
              s=str(k)
              low=s.casefold()
              if low.startswith("gxtpr_"):
                  s=s[6:]
              return re.sub(r"[^a-z0-9]","",s.casefold())

          def get_field(obj,name,default=None):
              if not isinstance(obj,dict):
                  return default
              target=canonical_key(name)
              for k,v in obj.items():
                  if canonical_key(k)==target:
                      return v
              return default

          def decode_jsonish(v,depth=0):
              if depth>3:
                  return v
              if isinstance(v,str):
                  s=v.strip()
                  if s and s[0] in '[{"':
                      try:
                          return decode_jsonish(json.loads(s),depth+1)
                      except Exception:
                          return v
              return v

          def norm(s):
              s=unicodedata.normalize("NFKD",str(s or ""))
              s="".join(ch for ch in s if not unicodedata.combining(ch))
              return re.sub(r"[^a-z0-9]+"," ",s.casefold()).strip()

          def sha_text(s):
              return hashlib.sha256(str(s).encode("utf-8",errors="replace")).hexdigest()

          def short(s,n=240):
              if s is None:
                  return None
              s=re.sub(r"\s+"," ",str(s)).strip()
              if len(s)<=n:
                  return s
              return {"length":len(s),"sha256":sha_text(s)}

          def public_area(area,source,index):
              return {
                  "source":source,
                  "index":index,
                  "AreaId":str(get_field(area,"AreaId","") or ""),
                  "AreaDivId":str(get_field(area,"AreaDivId","") or ""),
                  "AreaName":str(get_field(area,"AreaName","") or ""),
                  "AreaOrigin":str(get_field(area,"AreaOrigin","") or ""),
                  "AreaType":str(get_field(area,"AreaType","") or "")
              }

          def areas_from_portal(portal):
              portal=decode_jsonish(portal)
              rows=[]
              layers=get_field(portal,"Layers",[]) if isinstance(portal,dict) else []
              if not isinstance(layers,list):
                  return rows
              n=0
              for layer in layers:
                  areas=get_field(layer,"Areas",[]) if isinstance(layer,dict) else []
                  if not isinstance(areas,list):
                      continue
                  for area in areas:
                      if isinstance(area,dict):
                          n+=1
                          rows.append(public_area(area,"vSDT_TDAPORTAL",n))
              return rows

          def areas_from_refresh(refresh):
              refresh=decode_jsonish(refresh)
              if not isinstance(refresh,list):
                  return []
              return [public_area(a,"vAREASTOREFRESH",i) for i,a in enumerate(refresh,1) if isinstance(a,dict)]

          def unique_area_map(rows):
              by={}
              for r in rows:
                  key=r.get("AreaId") or ("ORIGIN:"+r.get("AreaOrigin",""))
                  if not key:
                      continue
                  if key not in by:
                      by[key]=dict(r)
                      by[key]["sources"]=[r["source"]]
                  elif r["source"] not in by[key]["sources"]:
                      by[key]["sources"].append(r["source"])
                  for f in ("AreaDivId","AreaName","AreaOrigin","AreaType"):
                      if not by[key].get(f) and r.get(f):
                          by[key][f]=r[f]
              return list(by.values())

          class InteractiveParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.nodes=[]
                  self.stack=[]
                  self.form_index=0
                  self.current_form=None
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower()
                  a={str(k).lower():v for k,v in attrs}
                  if tag=="form":
                      self.form_index+=1
                      self.current_form=self.form_index
                  interesting=tag in {"a","button","form","input","select","textarea"} or "onclick" in a or "href" in a
                  if interesting:
                      self.nodes.append({
                          "tag":tag,
                          "attrs":a,
                          "text_parts":[],
                          "form_index":self.current_form
                      })
                      self.stack.append((tag,len(self.nodes)-1))
              def handle_startendtag(self,tag,attrs):
                  self.handle_starttag(tag,attrs)
                  if self.stack:
                      self.stack.pop()
              def handle_data(self,data):
                  if not data.strip():
                      return
                  for _,idx in self.stack:
                      self.nodes[idx]["text_parts"].append(data)
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:
                          self.stack=self.stack[:i]
                          break
                  if tag=="form":
                      self.current_form=None

          def parse_action(attrs):
              onclick=str(attrs.get("onclick") or "")
              href=str(attrs.get("href") or "")
              srcs=[onclick]
              if href.lower().startswith("javascript:"):
                  srcs.append(href[len("javascript:"):])
              for src in srcs:
                  m=re.search(r"doPortalAction\s*\(\s*['\"]([^'\"]+)['\"]\s*,\s*['\"]([^'\"]*)['\"]\s*\)",src,re.I)
                  if m:
                      return {"kind":"doPortalAction","action":m.group(1),"parm":m.group(2)}
                  m=re.search(r"doAreaLink\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",src,re.I)
                  if m:
                      return {"kind":"doAreaLink","parm":m.group(1)}
                  m=re.search(r"doLink\s*\(\s*['\"]([^'\"]+)['\"]\s*\)",src,re.I)
                  if m:
                      return {"kind":"doLink","parm":m.group(1)}
              if href and not href.lower().startswith("javascript:") and href not in ("#",""):
                  u=urlparse(urljoin(START,href))
                  if (u.hostname or "").lower()==HOST and u.scheme in ("http","https"):
                      return {"kind":"href","href":href,"path":u.path,"query_keys":sorted(parse_qs(u.query,keep_blank_values=True).keys())}
              return None

          def sanitize_nodes(decoded):
              p=InteractiveParser()
              p.feed(decoded)
              nodes=[]
              actions=[]
              for idx,n in enumerate(p.nodes,1):
                  attrs={}
                  for k in ("id","class","name","type","title","aria-label","href","onclick","role","placeholder"):
                      if k in n["attrs"]:
                          attrs[k]=short(n["attrs"][k],240)
                  text=short(" ".join(n.get("text_parts") or []),120)
                  rec={"index":idx,"tag":n["tag"],"form_index":n.get("form_index"),"attrs":attrs,"text":text}
                  nodes.append(rec)
                  action=parse_action(n["attrs"])
                  if action:
                      actions.append({"node_index":idx,"action":action,"text":text})
              unique_actions=[]
              seen=set()
              for a in actions:
                  key=json.dumps(a["action"],ensure_ascii=False,sort_keys=True)
                  if key not in seen:
                      seen.add(key)
                      unique_actions.append(a)
              return nodes,unique_actions

          def term_counts(decoded):
              n=norm(decoded)
              result={}
              for t in ACCOUNTING_TERMS:
                  nt=norm(t)
                  result[t]=len(re.findall(r"(?<![a-z0-9])"+re.escape(nt)+r"(?![a-z0-9])",n))
              return result

          def recursive_exact_field_hits(obj,needle,path="$",out=None):
              if out is None:
                  out=[]
              if len(out)>=100:
                  return out
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      recursive_exact_field_hits(v,needle,path+"."+str(k),out)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      recursive_exact_field_hits(v,needle,path+f"[{i}]",out)
              elif isinstance(obj,str):
                  if needle and needle in obj:
                      out.append({"path":path,"count":obj.count(needle)})
              return out

          options=Options()
          for arg in (
              "--headless=new","--no-sandbox","--disable-dev-shm-usage",
              "--disable-background-networking","--disable-default-apps","--disable-sync",
              "--disable-component-update","--disable-domain-reliability","--metrics-recording-only",
              "--safebrowsing-disable-auto-update","--disable-features=OptimizationHints,MediaRouter",
              "--window-size=1365,900"
          ):
              options.add_argument(arg)
          options.set_capability("goog:loggingPrefs",{"performance":"ALL"})

          out={
              "task":"TASK_219Q_PASSIVE_SDT_LAYERINFO_MAPPING",
              "issue":723,
              "base_main_sha":"41c8744b278ad1072138cd62e3ed1c6ab221241f",
              "execution_head_sha":os.environ.get("GITHUB_SHA"),
              "boundary":{
                  "browser_sessions":1,"manual_navigations":1,"clicks":0,"typing":0,
                  "form_submissions":0,"manual_fetch_xhr":0,"direct_endpoint_calls":0,
                  "portal_action_triggers":0,"layerinfo_replay":0,"layerinfo_synthesis":0,
                  "retries":0,"commitment_lookup":0,"raw_har_persisted":False,
                  "raw_info_persisted":False,"raw_layerinfo_persisted":False
              },
              "state":{},
              "calls":[],
              "mapping":{},
              "despesa_response_inspection":None,
              "status":"RUNNING"
          }

          driver=None
          try:
              driver=webdriver.Chrome(options=options)
              driver.set_page_load_timeout(35)
              driver.execute_cdp_cmd("Network.enable",{})
              driver.get(START)
              time.sleep(8)

              state_raw=driver.execute_script("""
                function read(name){
                  try {
                    if(window.gx && gx.fn && typeof gx.fn.getControlValue === 'function'){
                      const v=gx.fn.getControlValue(name);
                      return {ok:true,json:JSON.stringify(v)};
                    }
                  } catch(e) { return {ok:false,error:e.name}; }
                  return {ok:false,error:'NO_GETTER'};
                }
                return {portal:read('vSDT_TDAPORTAL'), refresh:read('vAREASTOREFRESH')};
              """)

              def unpack(entry):
                  if not entry or not entry.get("ok"):
                      return None
                  try:
                      return decode_jsonish(json.loads(entry.get("json","null")))
                  except Exception:
                      return None

              portal=unpack(state_raw.get("portal"))
              refresh=unpack(state_raw.get("refresh"))
              portal_areas=areas_from_portal(portal)
              refresh_areas=areas_from_refresh(refresh)
              areas=unique_area_map(portal_areas+refresh_areas)

              out["state"]={
                  "portal_read":portal is not None,
                  "refresh_read":refresh is not None,
                  "portal_area_count":len(portal_areas),
                  "refresh_area_count":len(refresh_areas),
                  "unique_area_count":len(areas),
                  "areas":areas
              }

              logs=driver.get_log("performance")
              req_events=[]
              resp_events={}
              for e in logs:
                  try:
                      m=json.loads(e["message"])["message"]
                  except Exception:
                      continue
                  p=m.get("params") or {}
                  if m.get("method")=="Network.requestWillBeSent":
                      req=p.get("request") or {}
                      u=urlparse(req.get("url") or "")
                      if (u.hostname or "").lower()==HOST and u.path==ROUTE and (req.get("method") or "").upper()=="POST":
                          req_events.append({
                              "requestId":p.get("requestId"),
                              "timestamp":p.get("timestamp"),
                              "postData":req.get("postData") or ""
                          })
                  elif m.get("method")=="Network.responseReceived":
                      resp_events[p.get("requestId")]=p.get("response") or {}

              selected_despesa_response=None
              area_claims={a["AreaId"]:[] for a in areas if a.get("AreaId")}

              for ordinal,ev in enumerate(req_events,1):
                  rec={"ordinal":ordinal}
                  post=ev.get("postData") or ""
                  form=parse_qs(post,keep_blank_values=True)
                  vals=form.get("LayerInfo",[])
                  if len(vals)!=1:
                      rec["status"]="INVALID_LAYERINFO_FORM_FIELD_COUNT"
                      rec["LayerInfo_field_count"]=len(vals)
                      out["calls"].append(rec)
                      continue
                  layer_text=vals[0]
                  try:
                      layer=json.loads(layer_text)
                      req_obj=layer[0] if isinstance(layer,list) and len(layer)==1 and isinstance(layer[0],dict) else None
                  except Exception:
                      req_obj=None
                  if req_obj is None:
                      rec["status"]="INVALID_LAYERINFO_JSON_SHAPE"
                      out["calls"].append(rec)
                      continue

                  req_id=str(req_obj.get("id") or "")
                  rec["request_layerinfo_id"]=req_id
                  rec["request_info_length"]=len(str(req_obj.get("info") or ""))
                  rec["request_info_sha256"]=sha_text(str(req_obj.get("info") or ""))
                  rec["request_filterarea_length"]=len(str(req_obj.get("filterarea") or ""))
                  rec["exact_area_claims"]=[]

                  for area in areas:
                      identity_values=[]
                      for field in ("AreaId","AreaDivId","AreaOrigin"):
                          val=str(area.get(field) or "")
                          if val and val not in [x["value"] for x in identity_values]:
                              identity_values.append({"field":field,"value":val})
                      hits=[]
                      for ident in identity_values:
                          field_hits=recursive_exact_field_hits(req_obj,ident["value"])
                          if field_hits:
                              hits.append({
                                  "area_identity_field":ident["field"],
                                  "area_identity_value":ident["value"],
                                  "layerinfo_paths":field_hits
                              })
                      if hits:
                          claim={
                              "AreaId":area.get("AreaId"),
                              "AreaName":area.get("AreaName"),
                              "AreaOrigin":area.get("AreaOrigin"),
                              "hits":hits
                          }
                          rec["exact_area_claims"].append(claim)

                  rid=ev.get("requestId")
                  resp_obj=None
                  try:
                      body=driver.execute_cdp_cmd("Network.getResponseBody",{"requestId":rid})
                      raw=base64.b64decode(body.get("body","").encode("ascii"),validate=False) if body.get("base64Encoded") else body.get("body","").encode("utf-8")
                      parsed=json.loads(raw.decode("utf-8"))
                      resp_obj=parsed[0] if isinstance(parsed,list) and len(parsed)==1 and isinstance(parsed[0],dict) else None
                  except Exception as exc:
                      rec["response_body_status"]="UNAVAILABLE_OR_INVALID"
                      rec["response_error_type"]=type(exc).__name__

                  if resp_obj is not None:
                      resp_id=str(resp_obj.get("id") or "")
                      rec["response_layerinfo_id"]=resp_id
                      rec["request_response_id_equal"]=(req_id==resp_id)
                      rec["response_info_length"]=len(str(resp_obj.get("info") or ""))
                      rec["response_info_sha256"]=sha_text(str(resp_obj.get("info") or ""))
                  else:
                      rec["response_layerinfo_id"]=None
                      rec["request_response_id_equal"]=False

                  claim_count=len(rec["exact_area_claims"])
                  rec["unique_area_claim"]=(claim_count==1)
                  if claim_count==1 and rec["request_response_id_equal"]:
                      claim=rec["exact_area_claims"][0]
                      aid=claim.get("AreaId")
                      if aid in area_claims:
                          area_claims[aid].append({
                              "ordinal":ordinal,
                              "layerinfo_id":req_id,
                              "AreaName":claim.get("AreaName"),
                              "AreaOrigin":claim.get("AreaOrigin")
                          })
                      if aid==DESPESA_AREA_ID:
                          selected_despesa_response=resp_obj

                  rec["status"]="PASS_CALL_CAPTURE"
                  out["calls"].append(rec)

              mappings=[]
              for area in areas:
                  aid=area.get("AreaId")
                  claims=area_claims.get(aid,[])
                  mapped=len(claims)==1
                  mappings.append({
                      "AreaId":aid,
                      "AreaName":area.get("AreaName"),
                      "AreaOrigin":area.get("AreaOrigin"),
                      "claim_count":len(claims),
                      "mapping_proven":mapped,
                      "LayerInfoId":claims[0]["layerinfo_id"] if mapped else None,
                      "request_ordinal":claims[0]["ordinal"] if mapped else None
                  })

              desp=[m for m in mappings if m.get("AreaId")==DESPESA_AREA_ID]
              desp=desp[0] if desp else None
              out["mapping"]={
                  "automatic_call_count":len(req_events),
                  "mappings":mappings,
                  "mapped_area_count":sum(1 for m in mappings if m["mapping_proven"]),
                  "despesa_mapping":desp,
                  "despesa_mapping_proven":bool(desp and desp["mapping_proven"])
              }

              if out["mapping"]["despesa_mapping_proven"] and isinstance(selected_despesa_response,dict):
                  raw_info=selected_despesa_response.get("info")
                  if isinstance(raw_info,str):
                      decoded=html.unescape(raw_info)
                      nodes,actions=sanitize_nodes(decoded)
                      out["despesa_response_inspection"]={
                          "LayerInfoId":desp.get("LayerInfoId"),
                          "raw_info_persisted":False,
                          "raw_info_length":len(raw_info),
                          "raw_info_sha256":sha_text(raw_info),
                          "decoded_length":len(decoded),
                          "decoded_sha256":sha_text(decoded),
                          "accounting_term_counts":term_counts(decoded),
                          "interactive_node_count":len(nodes),
                          "interactive_nodes":nodes[:300],
                          "official_action_count":len(actions),
                          "official_actions":actions[:100]
                      }

              out["status"]="PASS_TASK219Q_PASSIVE_MAPPING"
          except Exception as exc:
              out["status"]="STOP_TASK219Q_RUNTIME"
              out["error_type"]=type(exc).__name__
              out["error_message"]=short(str(exc),240)
          finally:
              if driver is not None:
                  try:
                      driver.quit()
                  except Exception:
                      pass

          Path("runtime/task219q_result.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+"\n",
              encoding="utf-8"
          )
          print(json.dumps({
              "status":out["status"],
              "state":{k:v for k,v in out.get("state",{}).items() if k!="areas"},
              "mapping":out.get("mapping"),
              "despesa_response_inspection":out.get("despesa_response_inspection")
          },ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload sanitized mapping evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-219q-despesa-layerinfo-mapping-evidence
          path: runtime/task219q_result.json
          if-no-files-found: error
          retention-days: 1
