name: CI M7 OLINDA HASH ROUTING SIGNAL
run-name: "CI M7 Olinda hash routing signal by @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_siope_official_olinda_api_application_fragment_target_structure_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_hash_routing_signal_diagnostics_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_hash_routing_signal_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest tests.test_m7_siope_official_olinda_api_application_hash_routing_signal_diagnostics -v
      - run: python main.py selftest
