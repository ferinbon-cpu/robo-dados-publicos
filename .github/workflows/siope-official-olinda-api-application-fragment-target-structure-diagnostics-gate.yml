name: M7 SIOPE OFFICIAL OLINDA APPLICATION FRAGMENT TARGET STRUCTURE DIAGNOSTICS GATE
run-name: "M7 SIOPE official Olinda application fragment target structure diagnostics 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_official_olinda_application_fragment_target_structure_diagnostics:
        description: "Confirmar classificação passiva dos dois fragmentos e alvos DOM já existentes; sem clique, navegação ou retorno de valores"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.confirm_official_olinda_application_fragment_target_structure_diagnostics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_service_discovery_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_resource_contract_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_dom_structural_binding_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_loaded_script_syntax_skeleton_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_dom_syntax_skeleton_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_fragment_target_structure_diagnostics_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_fragment_target_structure_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Diagnosticar estrutura dos alvos dos fragmentos da aplicação Olinda sem navegação
        id: live
        continue-on-error: true
        run: python scripts/github_siope_official_olinda_api_application_fragment_target_structure_diagnostics_gate.py --output siope-official-olinda-application-fragment-target-structure-diagnostics-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-official-olinda-application-fragment-target-structure-diagnostics-${{ github.run_id }}
          path: siope-official-olinda-application-fragment-target-structure-diagnostics-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
