name: M7 SIOPE CLIENT LIMEIRA HISTORICAL PARAMETERIZED GENERALIZATION GATE
run-name: "M7 SIOPE historical parameterized generalization 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_historical_parameterized_generalization:
        description: "Confirmar revisão offline da generalização parametrizada com 2024-2022 completos + 2021 read-only; sem GET, Drive, lote live, retry, paginação ou schedule"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-client-limeira-historical-parameterized-generalization
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirm_siope_client_limeira_historical_parameterized_generalization == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Revisar generalização histórica parametrizada sem rede
        run: python scripts/github_siope_client_limeira_historical_parameterized_generalization_gate.py
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Publicar resultado da revisão
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: siope-client-limeira-historical-parameterized-generalization-${{ github.run_id }}
          path: siope-client-limeira-historical-parameterized-generalization-evidence/result.json
          if-no-files-found: error
          retention-days: 30
