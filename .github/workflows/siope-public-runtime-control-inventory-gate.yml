name: M7 SIOPE PUBLIC RUNTIME CONTROL INVENTORY GATE
run-name: "M7 SIOPE public runtime control inventory 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_public_runtime_control_inventory:
        description: "Confirmar inventário DOM read-only do exemplo público; sem interação, valores ou submit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inventory:
    if: ${{ inputs.confirm_public_runtime_control_inventory == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_siope_runtime_dependency_preflight.py
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_public_runtime_route_contract_review_gate.py
      - run: python scripts/github_siope_public_runtime_control_interaction_diagnostics_design_gate.py
      - run: python scripts/github_siope_public_runtime_control_inventory_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Inventariar controles DOM públicos sem interação
        id: live
        continue-on-error: true
        run: python scripts/github_siope_public_runtime_control_inventory_gate.py --output siope-public-runtime-control-inventory-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: siope-public-runtime-control-inventory-${{ github.run_id }}
          path: siope-public-runtime-control-inventory-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
