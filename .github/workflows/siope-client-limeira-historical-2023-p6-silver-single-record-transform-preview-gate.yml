name: M7 SIOPE CLIENT LIMEIRA HISTORICAL 2023 P6 SILVER SINGLE RECORD TRANSFORM PREVIEW GATE
run-name: "M7 SIOPE client Limeira historical 2023 P6 Silver single record transform preview 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_historical_2023_p6_silver_single_record_transform_preview:
        description: "Confirmar preview local lossless do Silver histórico 2023/P6; sem Drive, sem novo GET SIOPE, sem persistência Silver/Gold, lote histórico ou recorrência"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-client-limeira-historical-2023-p6-silver-single-record-transform-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.confirm_siope_client_limeira_historical_2023_p6_silver_single_record_transform_preview == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Revisar readback Bronze histórico 2023 P6 pinado
        run: python scripts/github_siope_client_limeira_historical_2023_p6_bronze_drive_readback_review_gate.py
      - name: Validar desenho Silver histórico sem rede nem writes
        run: python scripts/github_siope_client_limeira_historical_2023_p6_silver_single_record_transform_preview_gate.py --dry-run
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Executar preview Silver histórico lossless local
        id: preview
        shell: bash
        run: |
          set +e
          python scripts/github_siope_client_limeira_historical_2023_p6_silver_single_record_transform_preview_gate.py > "$RUNNER_TEMP/siope_historical_2023_p6_silver_preview_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-client-limeira-historical-2023-p6-silver-single-record-transform-preview-evidence
          if [ -s "$RUNNER_TEMP/siope_historical_2023_p6_silver_preview_result.json" ]; then
            cp "$RUNNER_TEMP/siope_historical_2023_p6_silver_preview_result.json" siope-client-limeira-historical-2023-p6-silver-single-record-transform-preview-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_CLIENT_LIMEIRA_HISTORICAL_2023_P6_SILVER_SINGLE_RECORD_TRANSFORM_PREVIEW_NO_RESULT","drive_write_count":0,"silver_payload_persisted":false,"source_network_called":false,"historical_collection_authorized":false}' > siope-client-limeira-historical-2023-p6-silver-single-record-transform-preview-evidence/result.json
          fi
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-client-limeira-historical-2023-p6-silver-single-record-transform-preview-${{ github.run_id }}
          path: siope-client-limeira-historical-2023-p6-silver-single-record-transform-preview-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-client-limeira-historical-2023-p6-silver-single-record-transform-preview-evidence/result.json
          code='${{ steps.preview.outputs.exit_code }}'
          if [ "${code:-28}" != "0" ]; then
            exit "${code:-28}"
          fi
          echo "PASS_M7_SIOPE_CLIENT_LIMEIRA_HISTORICAL_2023_P6_SILVER_SINGLE_RECORD_TRANSFORM_PREVIEW"
