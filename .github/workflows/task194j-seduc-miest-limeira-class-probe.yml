name: TASK 194J SEDUC MIEST Limeira class probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: task194j-seduc-miest-limeira
  cancel-in-progress: false

jobs:
  probe:
    if: github.event.issue.number == 619 && github.actor == 'ferinbon-cpu' && startsWith(github.event.comment.body, 'TASK194J_SEDUC_MIEST_AUTHORIZED ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}
      TASK194J_AUTH_COMMENT: ${{ github.event.comment.body }}
      TASK194J_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout exact main authorization target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Verify exact authorization
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$GITHUB_SHA"
          EXPECTED="TASK194J_SEDUC_MIEST_AUTHORIZED main=$GITHUB_SHA issue=619 max_http_requests=1 materialize=0"
          test "$TASK194J_AUTH_COMMENT" = "$EXPECTED"

      - name: Offline preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest tests.test_task_194j_seduc_miest_limeira_class_probe -v

      - name: Execute official MIEST December 2025 probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/task194j
          TASK194J_CHECKED_OUT_SHA="$(git rev-parse HEAD)" \
            python scripts/task194j_seduc_miest_limeira_class_probe.py \
            --output runtime/task194j/sanitized_miest_limeira_probe.json

      - name: Assert sanitized output only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d runtime/task194j ]; then
            find runtime/task194j -maxdepth 1 -type f -printf '%f\n' | grep -vx 'sanitized_miest_limeira_probe.json' && exit 1 || true
          fi

      - name: Upload sanitized MIEST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task194j-seduc-miest-limeira-probe
          path: runtime/task194j/sanitized_miest_limeira_probe.json
          if-no-files-found: warn
          retention-days: 30
