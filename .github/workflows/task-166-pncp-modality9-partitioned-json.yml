name: TASK 166 PNCP modality 9 partitioned direct JSON
run-name: "TASK 166 PNCP modality 9 partitioned JSON by @${{ github.actor }}"

on:
  push:
    branches:
      - task-166-pncp-modality9-direct-json
    paths:
      - 'runtime_triggers/task166_pncp_modality9_partitioned.run'

permissions:
  contents: read

concurrency:
  group: task-166-pncp-modality9-partitioned-json
  cancel-in-progress: false

jobs:
  task166-partitioned-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Fetch official PNCP JSON in contiguous monthly partitions
        shell: bash
        env:
          TASK166_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib, json, os, unicodedata
          from pathlib import Path
          import urllib.error, urllib.parse, urllib.request

          ENDPOINT="https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao"
          CNPJ="45132495000140"
          MOD=9
          PAGE_SIZE=50
          MAX_PAGES_PER_PARTITION=10
          TIMEOUT=60

          intervals=[
              ("20251128","20251130"),
              ("20251201","20251231"),
              ("20260101","20260131"),
              ("20260201","20260228"),
              ("20260301","20260331"),
              ("20260401","20260430"),
              ("20260501","20260531"),
              ("20260601","20260630"),
              ("20260701","20260731"),
              ("20260801","20260831"),
              ("20260901","20260904"),
          ]

          explicit_terms=["educacao integral","tempo integral","jornada ampliada","contraturno"]
          edu_terms=["educacao","escola","escolar","aluno","estudante","professor","educador","creche","pedagog","livro","curso","oficina","monitor"]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)

          def fold(v):
              s="" if v is None else str(v)
              s=unicodedata.normalize("NFKD",s)
              return "".join(ch for ch in s if not unicodedata.combining(ch)).lower().strip()

          def build_url(start,end,page):
              q=urllib.parse.urlencode([
                  ("dataInicial",start),
                  ("dataFinal",end),
                  ("codigoModalidadeContratacao",MOD),
                  ("cnpj",CNPJ),
                  ("pagina",page),
                  ("tamanhoPagina",PAGE_SIZE),
              ])
              return ENDPOINT+"?"+q

          def iso_day(raw):
              if not raw:
                  return None
              return str(raw)[:10].replace("-","")

          def norm(rec,start,end):
              org=rec.get("orgaoEntidade") or {}
              unit=rec.get("unidadeOrgao") or {}
              cnpj=str(org.get("cnpj") or rec.get("cnpj") or "")
              if cnpj != CNPJ:
                  raise RuntimeError("ENTITY_IDENTITY_MISMATCH")
              mid=rec.get("modalidadeId")
              if mid is not None and mid != MOD:
                  raise RuntimeError("MODALITY_IDENTITY_MISMATCH")
              pub=rec.get("dataPublicacaoPncp")
              day=iso_day(pub)
              if day is None or not (start <= day <= end):
                  raise RuntimeError("PUBLICATION_DATE_SCOPE_MISMATCH")
              return {
                  "anoCompra":rec.get("anoCompra"),
                  "sequencialCompra":rec.get("sequencialCompra"),
                  "numeroControlePNCP":rec.get("numeroControlePNCP"),
                  "processo":rec.get("processo"),
                  "numeroCompra":rec.get("numeroCompra"),
                  "objetoCompra":rec.get("objetoCompra"),
                  "valorTotalEstimado":rec.get("valorTotalEstimado"),
                  "valorTotalHomologado":rec.get("valorTotalHomologado"),
                  "dataPublicacaoPncp":pub,
                  "modalidadeId":rec.get("modalidadeId"),
                  "modalidadeNome":rec.get("modalidadeNome"),
                  "situacaoCompraNome":rec.get("situacaoCompraNome"),
                  "cnpj":cnpj,
                  "razaoSocial":org.get("razaoSocial"),
                  "municipioNome":unit.get("municipioNome"),
                  "ufSigla":unit.get("ufSigla"),
              }

          def validate_interval_cover(intervals):
              prev_end=None
              for start,end in intervals:
                  sd=dt.datetime.strptime(start,"%Y%m%d").date()
                  ed=dt.datetime.strptime(end,"%Y%m%d").date()
                  if ed < sd:
                      raise RuntimeError("INVALID_INTERVAL")
                  if prev_end is not None and sd != prev_end + dt.timedelta(days=1):
                      raise RuntimeError("INTERVAL_GAP_OR_OVERLAP")
                  prev_end=ed
              if intervals[0][0]!="20251128" or intervals[-1][1]!="20260904":
                  raise RuntimeError("OVERALL_SCOPE_MISMATCH")

          validate_interval_cover(intervals)
          requests=[]
          interval_results=[]
          all_records=[]
          overall_status="EXHAUSTIVE_COMPLETE"
          overall_failure=None

          for start,end in intervals:
              records=[]
              total_records=None
              total_pages=None
              status="EXHAUSTIVE_COMPLETE"
              failure=None
              page=1
              try:
                  while True:
                      url=build_url(start,end,page)
                      req=urllib.request.Request(url,method="GET",headers={
                          "Accept":"application/json",
                          "User-Agent":"robo-dados-publicos-task166-partitioned/0.8.0",
                      })
                      raw=b""
                      hs=None
                      ct=None
                      terr=None
                      try:
                          with opener.open(req,timeout=TIMEOUT) as response:
                              hs=int(response.status)
                              ct=response.headers.get("Content-Type")
                              raw=response.read(10000000+1)
                              if len(raw)>10000000:
                                  raise RuntimeError("RESPONSE_TOO_LARGE")
                      except urllib.error.HTTPError as exc:
                          hs=int(exc.code); terr=f"HTTP_ERROR_{exc.code}"
                      except urllib.error.URLError as exc:
                          terr=f"URL_ERROR:{type(exc.reason).__name__}"
                      except Exception as exc:
                          terr=f"TRANSPORT_ERROR:{type(exc).__name__}:{str(exc)[:160]}"

                      requests.append({
                          "start":start,"end":end,"page":page,"url":url,
                          "http_status":hs,"content_type":ct,"bytes_received":len(raw),
                          "sha256":hashlib.sha256(raw).hexdigest() if raw else None,
                          "transport_error":terr,
                      })
                      if hs != 200 or not raw:
                          raise RuntimeError("SOURCE_TRANSPORT_UNAVAILABLE")

                      try:
                          payload=json.loads(raw.decode("utf-8"))
                      except Exception as exc:
                          raise RuntimeError("SOURCE_SCHEMA_MISMATCH") from exc
                      data=payload.get("data")
                      if not isinstance(data,list):
                          raise RuntimeError("SOURCE_SCHEMA_MISMATCH")
                      if payload.get("numeroPagina") != page:
                          raise RuntimeError("PAGE_IDENTITY_MISMATCH")
                      tp=payload.get("totalPaginas")
                      tr=payload.get("totalRegistros")
                      if not isinstance(tp,int) or not isinstance(tr,int):
                          raise RuntimeError("PAGINATION_METADATA_MISSING")
                      if tp > MAX_PAGES_PER_PARTITION:
                          raise RuntimeError("PAGE_CAP_EXCEEDED")
                      if total_pages is None:
                          total_pages=tp; total_records=tr
                      elif total_pages != tp or total_records != tr:
                          raise RuntimeError("PAGINATION_METADATA_DRIFT")

                      for rawrec in data:
                          records.append(norm(rawrec,start,end))

                      if tp == 0 or page >= tp:
                          break
                      page += 1

                  if total_records is None:
                      raise RuntimeError("MISSING_TOTAL_RECORDS")
                  if len(records) != total_records:
                      raise RuntimeError("RECORD_COUNT_MISMATCH")
              except Exception as exc:
                  status="INCOMPLETE"
                  failure=f"{type(exc).__name__}:{str(exc)}"
                  overall_status="INCOMPLETE"
                  if overall_failure is None:
                      overall_failure=f"{start}-{end}:{failure}"

              interval_results.append({
                  "start":start,"end":end,"status":status,"failure":failure,
                  "totalRegistros":total_records,"totalPaginas":total_pages,
                  "record_count":len(records),"records":records,
              })
              all_records.extend(records)

          controls=[r.get("numeroControlePNCP") for r in all_records]
          nonnull=[x for x in controls if x]
          if len(nonnull) != len(set(nonnull)):
              overall_status="INCOMPLETE"
              overall_failure=overall_failure or "DUPLICATE_STABLE_ID_ACROSS_DISJOINT_PARTITIONS"

          explicit=[]
          education=[]
          school_pass=[]
          i00084=[]
          for r in all_records:
              obj=fold(r.get("objetoCompra"))
              proc=fold(r.get("processo"))
              if any(fold(t) in obj for t in explicit_terms):
                  explicit.append(r)
              if any(fold(t) in obj for t in edu_terms):
                  education.append(r)
              try:
                  val=float(r.get("valorTotalEstimado"))
              except Exception:
                  val=None
              if "passe escolar" in obj and val is not None and abs(val-3816720.0)<=0.01:
                  school_pass.append(r)
              if proc=="i00084" and "curso de capacitacao" in obj and val is not None and abs(val-12400.0)<=0.01:
                  i00084.append(r)

          exhaustive=(overall_status=="EXHAUSTIVE_COMPLETE")
          result={
              "schema":"TASK166_PNCP_MODALITY9_PARTITIONED_RESULT_V1",
              "execution_head_sha":os.environ["TASK166_HEAD_SHA"],
              "authorization_scope":"PNCP_LIVE_READ_DISCOVERY_ONLY",
              "overall_scope":{"dataInicial":"20251128","dataFinal":"20260904","cnpj":CNPJ,"modalidade":MOD,"page_size":PAGE_SIZE},
              "intervals":interval_results,
              "requests":requests,
              "status":overall_status,
              "failure":overall_failure,
              "exhaustive_within_exact_overall_scope":exhaustive,
              "total_records_observed":len(all_records),
              "records":all_records,
              "target_hits":{"SCHOOL_PASS":school_pass,"I00084":i00084},
              "explicit_eiti_hits":explicit,
              "education_hits":education,
              "explicit_eiti_match_count":len(explicit),
              "education_hit_count":len(education),
              "raw_payload_persisted":False,
              "git_write":False,
              "drive_write":False,
          }
          result["result_sha256"]=hashlib.sha256(
              json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")
          ).hexdigest()
          Path("runtime/task166_partitioned_result.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print("TASK166_PARTITIONED_STATUS="+overall_status)
          print("TASK166_PARTITIONED_RECORDS="+str(len(all_records)))
          print("TASK166_PARTITIONED_EXPLICIT_EITI="+str(len(explicit)))
          print("TASK166_PARTITIONED_EDUCATION="+str(len(education)))
          print("TASK166_PARTITIONED_SCHOOL_PASS="+str(len(school_pass)))
          print("TASK166_PARTITIONED_I00084="+str(len(i00084)))
          PY

      - name: Upload sanitized partitioned result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-166-pncp-modality9-partitioned-json-result
          path: runtime/task166_partitioned_result.json
          if-no-files-found: error
          retention-days: 1
