name: TASK 033 JOM custody live once
run-name: "TASK 033 JOM custody live once by @${{ github.actor }}"

on:
  push:
    branches: [task-033-jom-custody-live-once]
    paths:
      - '.github/workflows/task-033-jom-custody-live-once.yml'

permissions:
  contents: read

concurrency:
  group: task-033-jom-custody-live-once
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire exact three JOM originals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Execute exact bounded custody operation
        run: python scripts/task_033_jom_custody_live_once.py
