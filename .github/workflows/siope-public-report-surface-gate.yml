name: M7 SIOPE PUBLIC REPORT SURFACE GATE
run-name: "M7 SIOPE public report surface 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_public_report_surface:
        description: "Confirmar leitura GET-only da superfície pública de relatórios SIOPE, sem submeter formulário"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    if: ${{ inputs.confirm_public_report_surface == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_public_report_surface_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Descobrir superfície pública de relatórios SIOPE
        id: live
        continue-on-error: true
        run: python scripts/github_siope_public_report_surface_gate.py --output siope-public-report-surface-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: siope-public-report-surface-${{ github.run_id }}
          path: siope-public-report-surface-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
