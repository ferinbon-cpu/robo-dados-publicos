name: M8 SIOPE HISTORICAL GOLD PRODUCT OUTPUT READONLY GATE
run-name: "M8 SIOPE historical Gold product output readonly 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_m8_siope_historical_gold_product_output_readonly:
        description: "Confirmar releitura dos 9 Gold SIOPE 2016-2024 e geração somente local do bundle; zero GET FNDE/SIOPE, zero writes Drive, publicação não autorizada"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m8-siope-historical-gold-product-output-readonly
  cancel-in-progress: false

jobs:
  build-readonly-product:
    if: ${{ inputs.confirm_m8_siope_historical_gold_product_output_readonly == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Validar desenho M8 read-only
        run: python scripts/github_m8_siope_historical_gold_product_output_readonly_gate.py --dry-run
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Validar presença de credenciais OAuth
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          names = (
              'GOOGLE_DRIVE_CLIENT_ID',
              'GOOGLE_DRIVE_CLIENT_SECRET',
              'GOOGLE_DRIVE_REFRESH_TOKEN',
          )
          missing = [name for name in names if not os.getenv(name, '').strip()]
          if missing:
              print('STOP_MISSING_GITHUB_SECRETS: ' + ', '.join(missing))
              sys.exit(3)
          print('OAuth secrets: PRESENTES (valores não exibidos)')
          PY
      - name: Reler 9 Gold e gerar bundle local
        id: live
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/m8_siope_product"
          python scripts/github_m8_siope_historical_gold_product_output_readonly_gate.py \
            --output-dir "$RUNNER_TEMP/m8_siope_product" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$RUNNER_TEMP/m8_siope_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preparar evidência e produto sanitizados
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p m8-siope-historical-gold-product-output-readonly-evidence/product
          if [ -s "$RUNNER_TEMP/m8_siope_result.json" ]; then
            cp "$RUNNER_TEMP/m8_siope_result.json" m8-siope-historical-gold-product-output-readonly-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M8_SIOPE_HISTORICAL_GOLD_PRODUCT_OUTPUT_READONLY_NO_RESULT","source_get_count":0,"drive_write_count":0,"publication_authorized":false,"remote_file_id_persisted":false,"future_batch_execution_authorized":false}' > m8-siope-historical-gold-product-output-readonly-evidence/result.json
          fi
          if [ -d "$RUNNER_TEMP/m8_siope_product" ]; then
            cp -a "$RUNNER_TEMP/m8_siope_product/." m8-siope-historical-gold-product-output-readonly-evidence/product/
          fi
      - name: Publicar artifact GitHub sanitizado
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m8-siope-historical-gold-product-output-readonly-${{ github.run_id }}
          path: m8-siope-historical-gold-product-output-readonly-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat m8-siope-historical-gold-product-output-readonly-evidence/result.json
          code='${{ steps.live.outputs.exit_code }}'
          if [ "${code:-34}" != "0" ]; then
            exit "${code:-34}"
          fi
          echo "PASS_M8_SIOPE_HISTORICAL_GOLD_PRODUCT_OUTPUT_READONLY"
