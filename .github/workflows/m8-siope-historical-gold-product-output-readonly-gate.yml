name: M8 SIOPE HISTORICAL GOLD PRODUCT OUTPUT READONLY GATE
run-name: "M8 SIOPE historical Gold product output readonly 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_m8_siope_historical_gold_product_output_readonly:
        description: "Confirmar releitura dos 9 Gold SIOPE 2016-2024 e geração somente local do bundle; zero GET FNDE/SIOPE, zero writes Drive, publicação não autorizada"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m8-siope-historical-gold-product-output-readonly
  cancel-in-progress: false

jobs:
  call-readonly-worker:
    if: ${{ inputs.confirm_m8_siope_historical_gold_product_output_readonly == true }}
    uses: ./.github/workflows/m8-siope-historical-gold-product-output-readonly-reusable.yml
    with:
      confirm_m8_siope_historical_gold_product_output_readonly: ${{ inputs.confirm_m8_siope_historical_gold_product_output_readonly }}
    secrets:
      GOOGLE_DRIVE_READONLY_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_READONLY_CLIENT_ID }}
      GOOGLE_DRIVE_READONLY_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_READONLY_CLIENT_SECRET }}
      GOOGLE_DRIVE_READONLY_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_READONLY_REFRESH_TOKEN }}
