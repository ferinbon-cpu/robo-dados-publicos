name: CI OFFLINE
run-name: "CI offline 0.8.0 candidate M7 by @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar sem Drive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight offline
        run: python scripts/github_preflight.py

      - name: Gate de política de automação
        run: python scripts/github_automation_policy_gate.py

      - name: Gate da política do engenheiro Codex
        run: python scripts/github_codex_engineer_policy_gate.py

      - name: Gate offline do bootstrap operacional TASK 018
        run: python scripts/github_task_018_full_operational_bootstrap_design_gate.py

      - name: Gate T0 do desenho da prova incremental Jornal TASK 021
        run: python scripts/github_task_021_jornal_incremental_live_proof_gate_design.py

      - name: Gate T0 da revisão do checkpoint real Jornal TASK 022
        run: python scripts/github_task_022_jornal_real_checkpoint_pinning_review_gate.py

      - name: Gate T0 de regimes históricos SIOPE
        run: python scripts/github_siope_historical_regime_discovery_gate.py

      - name: Gate T0 do desenho read-only SIOPE 2025
        run: python scripts/github_siope_2025_readonly_discovery_design_gate.py

      - name: Fixtures T0 do discovery read-only SIOPE 2025
        run: python scripts/github_siope_2025_readonly_discovery_offline_fixtures_gate.py

      - name: Runner bounded T0 SIOPE 2025 com fake transport
        run: python scripts/github_siope_2025_bounded_runner_gate.py

      - name: Revisão M8 offline de publicação
        run: python scripts/review_m8_siope_historical_product_output_publication.py

      - name: Gate M7 de desenho da expansão
        run: python scripts/github_source_expansion_design_gate.py

      - name: Gate M7 de revisão contratual do runtime SIOPE
        run: python scripts/github_siope_public_runtime_route_contract_review_gate.py

      - name: Gate M7 de desenho da interação controlada SIOPE
        run: python scripts/github_siope_public_runtime_control_interaction_diagnostics_design_gate.py

      - name: Gate M7 de inventário DOM SIOPE (dry-run)
        run: python scripts/github_siope_public_runtime_control_inventory_gate.py --dry-run

      - name: Gate M7 de revisão do inventário DOM SIOPE
        run: python scripts/github_siope_public_runtime_control_inventory_review_gate.py

      - name: Gate M7 de desenho da consistência de valores SIOPE
        run: python scripts/github_siope_public_runtime_control_value_consistency_diagnostics_design_gate.py

      - name: Gate M7 de consistência booleana SIOPE (dry-run)
        run: python scripts/github_siope_public_runtime_control_value_consistency_diagnostics_gate.py --dry-run

      - name: Gate M7 de revisão da consistência booleana SIOPE
        run: python scripts/github_siope_public_runtime_control_value_consistency_review_gate.py

      - name: Gate M7 de desenho semântico passivo de acao
        run: python scripts/github_siope_public_runtime_action_control_semantics_diagnostics_design_gate.py

      - name: Gate M7 semântico passivo de acao (dry-run)
        run: python scripts/github_siope_public_runtime_action_control_semantics_diagnostics_gate.py --dry-run

      - name: Gate M7 de revisão semântica de acao
        run: python scripts/github_siope_public_runtime_action_control_semantics_review_gate.py

      - name: Gate M7 de partição de equivalência query-control
        run: python scripts/github_siope_public_runtime_query_equivalence_partition_design_gate.py

      - name: Gate M7 de desenho da descoberta do segundo exemplo público
        run: python scripts/github_siope_public_indexed_get_second_example_discovery_design_gate.py

      - name: Gate M7 de desenho da API oficial Olinda SIOPE
        run: python scripts/github_siope_official_olinda_api_discovery_design_gate.py

      - name: Gate M7 de catálogo Olinda SIOPE (dry-run)
        run: python scripts/github_siope_official_olinda_api_service_discovery_gate.py --dry-run

      - name: Gate M7 de revisão do catálogo Olinda SIOPE
        run: python scripts/github_siope_official_olinda_api_service_discovery_review_gate.py

      - name: Gate M7 de desenho do contrato de recurso Olinda SIOPE
        run: python scripts/github_siope_official_olinda_api_resource_contract_design_gate.py

      - name: Gate M7 de desenho do diagnóstico passivo da aplicação Olinda
        run: python scripts/github_siope_official_olinda_api_application_runtime_route_diagnostics_design_gate.py

      - name: Gate M7 de diagnóstico passivo da aplicação Olinda (dry-run)
        run: python scripts/github_siope_official_olinda_api_application_runtime_route_diagnostics_gate.py --dry-run

      - name: Gate M7 de diagnóstico booleano da superfície Olinda (dry-run)
        run: python scripts/github_siope_official_olinda_api_application_surface_boolean_diagnostics_gate.py --dry-run

      - name: Gate M7 de revisão do diagnóstico booleano da superfície Olinda
        run: python scripts/github_siope_official_olinda_api_application_surface_boolean_diagnostics_review_gate.py

      - name: Gate M7 de diagnóstico de rotas Olinda tolerante a fragmento (dry-run)
        run: python scripts/github_siope_official_olinda_api_application_fragment_tolerant_route_diagnostics_gate.py --dry-run

      - name: Gate M7 de revisão do diagnóstico de rotas Olinda tolerante a fragmento
        run: python scripts/github_siope_official_olinda_api_application_fragment_tolerant_route_diagnostics_review_gate.py

      - name: Gate M7 de desenho do diagnóstico de assinaturas DOM Olinda
        run: python scripts/github_siope_official_olinda_api_application_dom_signature_diagnostics_design_gate.py

      - name: Gate M7 de assinaturas DOM Olinda (dry-run)
        run: python scripts/github_siope_official_olinda_api_application_dom_signature_diagnostics_gate.py --dry-run

      - name: Gate M7 de revisão das assinaturas DOM Olinda
        run: python scripts/github_siope_official_olinda_api_application_dom_signature_diagnostics_review_gate.py

      - name: Gate M7 de desenho do vínculo estrutural DOM Olinda
        run: python scripts/github_siope_official_olinda_api_application_dom_structural_binding_diagnostics_design_gate.py

      - name: Gate M7 de vínculo estrutural DOM Olinda (dry-run)
        run: python scripts/github_siope_official_olinda_api_application_dom_structural_binding_diagnostics_gate.py --dry-run

      - name: Gate M7 de revisão do vínculo estrutural DOM Olinda
        run: python scripts/github_siope_official_olinda_api_application_dom_structural_binding_diagnostics_review_gate.py

      - name: Gate M7 de desenho do contrato do atributo de navegação DOM Olinda
        run: python scripts/github_siope_official_olinda_api_application_dom_navigation_attribute_contract_diagnostics_design_gate.py

      - name: Gate M7 do contrato do atributo de navegação DOM Olinda (dry-run)
        run: python scripts/github_siope_official_olinda_api_application_dom_navigation_attribute_contract_diagnostics_gate.py --dry-run

      - name: Gate M7 de revisão do contrato do atributo de navegação DOM Olinda
        run: python scripts/github_siope_official_olinda_api_application_dom_navigation_attribute_contract_diagnostics_review_gate.py

      - name: Gate M7 de desenho da distribuição dos matches de navegação DOM Olinda
        run: python scripts/github_siope_official_olinda_api_application_dom_navigation_match_distribution_diagnostics_design_gate.py

      - name: Gate M7 da distribuição dos matches de navegação DOM Olinda (dry-run)
        run: python scripts/github_siope_official_olinda_api_application_dom_navigation_match_distribution_diagnostics_gate.py --dry-run

      - name: Compilar
        run: python -m compileall -q .

      - name: Gate T0 TASK 023 da implementação bounded incremental do Jornal
        run: python scripts/github_task_023_jornal_bounded_live_incremental_proof_implementation_review_gate.py

      - name: Gate T0 BI-001 da arquitetura analítica Drive-first
        run: python scripts/github_bi_001_analytics_output_architecture_gate.py

      - name: Gate T0 BI-002 da materialização controlada
        run: python scripts/github_bi_002_materialization_gate.py

      - name: Gate T0 BI-003 da stable serving layer
        run: python scripts/github_bi_003_serving_gate.py

      - name: Gate T0 BI-005 da integração final serving
        run: python scripts/github_bi_005_generalized_serving_executor_gate.py

      - name: Gate T0 do portal analítico final
        run: python scripts/github_portal_analitico_final_gate.py

      - name: Gate T0 TASK 025 da ingestão manual supervisionada F01
        run: python scripts/github_task_025_manual_supervised_ingest_f01_gate.py

      - name: Gate T0 TASK 026 da reconciliação do staging F01
        run: python scripts/github_task_026_f01_staging_reconciliation_gate.py

      - name: Gate T0 TASK 027 do desenho de extração reproduzível da LOA
        run: python scripts/github_task_027_loa_reproducible_extraction_readiness_gate.py

      - name: Gate T0 TASK 031 da fonte primária Jornal no F01
        run: python scripts/github_task_031_budget_laws_journal_source_first_gate.py

      - name: Gate T0 TASK 032 da aquisição bounded dos originais Jornal
        run: python scripts/github_task_032_budget_journal_bounded_acquisition_gate.py

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest
