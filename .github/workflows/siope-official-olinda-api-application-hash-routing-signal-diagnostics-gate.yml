name: M7 SIOPE OFFICIAL OLINDA APPLICATION HASH ROUTING SIGNAL DIAGNOSTICS GATE
run-name: "M7 SIOPE official Olinda application hash routing signal diagnostics 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_official_olinda_application_hash_routing_signal_diagnostics:
        description: "Confirmar contagem passiva de sinais de hash-routing em scripts já carregados; sem fragment value, clique ou navegação"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.confirm_official_olinda_application_hash_routing_signal_diagnostics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_siope_official_olinda_api_application_fragment_target_structure_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_hash_routing_signal_diagnostics_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_hash_routing_signal_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Diagnosticar sinais de hash-routing em scripts já carregados sem navegação
        id: live
        continue-on-error: true
        run: python scripts/github_siope_official_olinda_api_application_hash_routing_signal_diagnostics_gate.py --output siope-official-olinda-application-hash-routing-signal-diagnostics-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-official-olinda-application-hash-routing-signal-diagnostics-${{ github.run_id }}
          path: siope-official-olinda-application-hash-routing-signal-diagnostics-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
