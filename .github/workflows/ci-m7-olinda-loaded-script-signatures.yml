name: CI M7 OLINDA LOADED SCRIPT SIGNATURES
run-name: "CI M7 Olinda loaded script signatures by @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_siope_official_olinda_api_application_dom_navigation_match_distribution_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_loaded_script_signature_diagnostics_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_loaded_script_signature_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest tests.test_m7_siope_official_olinda_api_application_loaded_script_signature_diagnostics -v
      - run: python main.py selftest
