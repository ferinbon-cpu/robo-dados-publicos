name: M7 SIOPE CLIENT LIMEIRA HISTORICAL 2023 P6 FULL SCHEMA READONLY VALIDATION GATE
run-name: "M7 SIOPE client Limeira historical 2023 P6 full schema readonly validation 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_historical_2023_p6_full_schema_readonly_validation:
        description: "Confirmar exatamente um GET histórico público de Limeira 2023/P6 com os 52 campos já comprovados; sem persistência, coleta histórica, retry, paginação ou recorrência"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-client-limeira-historical-2023-p6-full-schema-readonly-validation
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirm_siope_client_limeira_historical_2023_p6_full_schema_readonly_validation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Revisar readback Gold pinado
        run: python scripts/github_siope_client_limeira_gold_drive_readback_review_gate.py
      - name: Validar desenho histórico 2023 P6 sem rede
        run: python scripts/github_siope_client_limeira_historical_2023_p6_full_schema_readonly_validation_gate.py --dry-run
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Executar um único GET histórico Limeira 2023 P6 com os 52 campos comprovados
        id: live
        continue-on-error: true
        run: python scripts/github_siope_client_limeira_historical_2023_p6_full_schema_readonly_validation_gate.py --output siope-client-limeira-historical-2023-p6-full-schema-readonly-validation-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-client-limeira-historical-2023-p6-full-schema-readonly-validation-${{ github.run_id }}
          path: siope-client-limeira-historical-2023-p6-full-schema-readonly-validation-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
