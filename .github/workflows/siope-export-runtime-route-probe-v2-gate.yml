name: M7 SIOPE EXPORT RUNTIME ROUTE PROBE V2 GATE
run-name: "M7 SIOPE export runtime route probe V2 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_export_runtime_route_probe_v2:
        description: "Confirmar probe V2: permitir somente assets estáticos oficiais e abortar demais requisições pós-clique antes da rede"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: robo-dados-publicos-siope-export-runtime-route-probe-v2
  cancel-in-progress: false

jobs:
  probe:
    name: Interceptar rota de exportação SIOPE com allowlist estática
    if: ${{ inputs.confirm_export_runtime_route_probe_v2 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências gerais
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Instalar dependência isolada do CDP
        run: python -m pip install --disable-pip-version-check -r requirements-runtime-probe.txt
      - name: Preflight offline da candidata
        run: python scripts/github_preflight.py
      - name: Validar desenho fail-closed do runtime probe
        run: python scripts/github_siope_export_runtime_route_probe_design_gate.py
      - name: Dry-run V2 sem navegador e sem rede
        run: python scripts/github_siope_export_runtime_route_probe_v2_gate.py --dry-run
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Probe V2 ao vivo
        id: runtime_gate
        shell: bash
        run: |
          set +e
          python scripts/github_siope_export_runtime_route_probe_v2_gate.py > "$RUNNER_TEMP/siope_export_runtime_route_probe_v2_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-export-runtime-route-probe-v2-evidence
          if [ -s "$RUNNER_TEMP/siope_export_runtime_route_probe_v2_result.json" ]; then
            cp "$RUNNER_TEMP/siope_export_runtime_route_probe_v2_result.json" siope-export-runtime-route-probe-v2-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_EXPORT_RUNTIME_ROUTE_PROBE_V2_NO_RESULT","candidate_route_network_sent":false,"artifact_downloaded":false,"head_request_performed":false,"remote_writes":"NONE","collection_authorized":false,"processing_authorized":false,"recurrence_authorized":false,"schedule_enabled":false}' > siope-export-runtime-route-probe-v2-evidence/result.json
          fi
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: siope-export-runtime-route-probe-v2-${{ github.run_id }}
          path: siope-export-runtime-route-probe-v2-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar resultado do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-export-runtime-route-probe-v2-evidence/result.json
          code='${{ steps.runtime_gate.outputs.exit_code }}'
          if [ "${code:-27}" != "0" ]; then
            exit "${code:-27}"
          fi
          echo "PASS_M7_SIOPE_EXPORT_RUNTIME_ROUTE_PROBE_V2_GATE"
