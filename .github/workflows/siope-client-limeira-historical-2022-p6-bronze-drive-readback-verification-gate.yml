name: M7 SIOPE CLIENT LIMEIRA HISTORICAL 2022 P6 BRONZE DRIVE READBACK VERIFICATION GATE
run-name: "M7 SIOPE client Limeira historical 2022 P6 Bronze Drive readback verification 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_historical_2022_p6_bronze_drive_readback_verification:
        description: "Confirmar leitura de verificação do bundle Bronze histórico 2022/P6 já persistido; zero writes, sem novo GET SIOPE, sem lote, Silver/Gold ou recorrência"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-client-limeira-historical-2022-p6-bronze-drive-readback-verification
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirm_siope_client_limeira_historical_2022_p6_bronze_drive_readback_verification == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Revisar persistência Bronze histórica 2022 P6 pinada
        run: python scripts/github_siope_client_limeira_historical_2022_p6_bronze_drive_persistence_review_gate.py
      - name: Validar desenho readback histórico sem rede
        run: python scripts/github_siope_client_limeira_historical_2022_p6_bronze_drive_readback_verification_gate.py --dry-run
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Validar presença de credenciais OAuth
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          names = (
              'GOOGLE_DRIVE_CLIENT_ID',
              'GOOGLE_DRIVE_CLIENT_SECRET',
              'GOOGLE_DRIVE_REFRESH_TOKEN',
          )
          missing = [name for name in names if not os.getenv(name, '').strip()]
          if missing:
              print('STOP_MISSING_GITHUB_SECRETS: ' + ', '.join(missing))
              sys.exit(3)
          print('OAuth secrets: PRESENTES (valores não exibidos)')
          PY
      - name: Reler e verificar exatamente o bundle Bronze histórico 2022 P6
        id: live
        shell: bash
        run: |
          set +e
          python scripts/github_siope_client_limeira_historical_2022_p6_bronze_drive_readback_verification_gate.py > "$RUNNER_TEMP/siope_historical_2022_p6_bronze_drive_readback_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-client-limeira-historical-2022-p6-bronze-drive-readback-verification-evidence
          if [ -s "$RUNNER_TEMP/siope_historical_2022_p6_bronze_drive_readback_result.json" ]; then
            cp "$RUNNER_TEMP/siope_historical_2022_p6_bronze_drive_readback_result.json" siope-client-limeira-historical-2022-p6-bronze-drive-readback-verification-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_CLIENT_LIMEIRA_HISTORICAL_2022_P6_BRONZE_DRIVE_READBACK_VERIFICATION_NO_RESULT","remote_file_id_persisted":false,"secret_values_exposed":false,"drive_write_count":0,"historical_collection_authorized":false}' > siope-client-limeira-historical-2022-p6-bronze-drive-readback-verification-evidence/result.json
          fi
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-client-limeira-historical-2022-p6-bronze-drive-readback-verification-${{ github.run_id }}
          path: siope-client-limeira-historical-2022-p6-bronze-drive-readback-verification-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-client-limeira-historical-2022-p6-bronze-drive-readback-verification-evidence/result.json
          code='${{ steps.live.outputs.exit_code }}'
          if [ "${code:-26}" != "0" ]; then
            exit "${code:-26}"
          fi
          echo "PASS_M7_SIOPE_CLIENT_LIMEIRA_HISTORICAL_2022_P6_BRONZE_DRIVE_READBACK_VERIFICATION"
