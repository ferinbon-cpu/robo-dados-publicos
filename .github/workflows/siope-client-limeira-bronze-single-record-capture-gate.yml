name: M7 SIOPE CLIENT LIMEIRA BRONZE SINGLE RECORD CAPTURE GATE
run-name: "M7 SIOPE client Limeira bronze single record capture 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_bronze_single_record_capture:
        description: "Confirmar exatamente um GET público de Limeira e persistir exatamente um registro de 52 campos como Bronze imutável; sem retry, paginação, Silver/Gold ou recorrência"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.confirm_siope_client_limeira_bronze_single_record_capture == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - name: Revisar evidência pinada dos 52 campos
        run: python scripts/github_siope_client_limeira_full_schema_readonly_validation_review_gate.py
      - name: Validar desenho da captura Bronze sem rede
        run: python scripts/github_siope_client_limeira_bronze_single_record_capture_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Capturar exatamente um registro Bronze de Limeira
        id: live
        continue-on-error: true
        run: python scripts/github_siope_client_limeira_bronze_single_record_capture_gate.py
      - name: Publicar Bronze + manifesto + resultado
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: siope-client-limeira-bronze-single-record-capture-${{ github.run_id }}
          path: siope-client-limeira-bronze-single-record-capture-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
