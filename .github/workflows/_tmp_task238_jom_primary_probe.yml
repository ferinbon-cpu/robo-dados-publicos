name: TASK238 JOM primary probe wave3 TEMP

on:
  push:
    branches:
      - task238-jom-primary-probe-wave3

permissions:
  contents: read

concurrency:
  group: task238-jom-primary-probe-wave3-temp
  cancel-in-progress: false

jobs:
  probe:
    name: Probe 7142 7151 7168 read-only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Executar probe primário bounded
        run: python scripts/_tmp_task238_jom_primary_probe.py --out probe-output

      - name: Resumo auditável no log
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('probe-output/task238_jom_primary_probe_wave3.json')
          if not path.exists():
              print(json.dumps({'status':'STOP_NO_PROBE_OUTPUT'}))
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding='utf-8'))
          out = {
              'schema': data.get('schema'),
              'status': data.get('status'),
              'target_editions': data.get('target_editions'),
              'discovered_target_editions': data.get('discovered_target_editions'),
              'missing_target_editions': data.get('missing_target_editions'),
              'discovery_telemetry': data.get('discovery_telemetry'),
              'inspections': [],
          }
          for row in data.get('inspections') or []:
              clean = {k: row.get(k) for k in (
                  'edition','publication_date','document_url','source_page_url','trigger',
                  'status','bytes','sha256','pdf_page_count','trigger_hit_count','fetch','error'
              ) if k in row}
              clean['extraction_errors'] = row.get('extraction_errors') or []
              clean['hits'] = [
                  {
                      'term': h.get('term'),
                      'pdf_page': h.get('pdf_page'),
                      'excerpt_normalized': h.get('excerpt_normalized'),
                  }
                  for h in (row.get('hits') or [])
              ]
              out['inspections'].append(clean)
          print('TASK238_PROBE_SUMMARY_BEGIN')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          print('TASK238_PROBE_SUMMARY_END')
          PY

      - name: Publicar artifact imutável da probe
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task238-jom-primary-probe-wave3-${{ github.run_id }}
          path: probe-output/
          if-no-files-found: warn
          retention-days: 7
