name: M7 SIOPE PUBLIC INDEXED GET CONTRACT GATE
run-name: "M7 SIOPE public indexed GET contract 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_public_indexed_get_contract:
        description: "Confirmar um único GET para exemplo público já indexado pelo FNDE, sem valores do piloto Limeira"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.confirm_public_indexed_get_contract == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_public_indexed_get_contract_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Verificar contrato GET público indexado SIOPE
        id: live
        continue-on-error: true
        run: python scripts/github_siope_public_indexed_get_contract_gate.py --output siope-public-indexed-get-contract-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-public-indexed-get-contract-${{ github.run_id }}
          path: siope-public-indexed-get-contract-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
