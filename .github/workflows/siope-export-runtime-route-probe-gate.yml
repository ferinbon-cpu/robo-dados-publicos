name: M7 SIOPE EXPORT RUNTIME ROUTE PROBE GATE
run-name: "M7 SIOPE export runtime route probe 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_export_runtime_route_probe:
        description: "Confirmar probe runtime com interceptação/abort antes da rede, sem download"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: robo-dados-publicos-siope-export-runtime-route-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Interceptar rota runtime do export SIOPE
    if: ${{ inputs.confirm_export_runtime_route_probe == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Instalar dependências gerais
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Instalar dependência isolada do CDP
        run: python -m pip install --disable-pip-version-check -r requirements-runtime-probe.txt

      - name: Preflight offline da candidata
        run: python scripts/github_preflight.py

      - name: Validar desenho do runtime probe
        run: python scripts/github_siope_export_runtime_route_probe_design_gate.py

      - name: Dry-run sem navegador e sem rede
        run: python scripts/github_siope_export_runtime_route_probe_gate.py --dry-run

      - name: Compilar
        run: python -m compileall -q .

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest

      - name: Probe runtime ao vivo com abort antes da rede
        id: runtime_gate
        shell: bash
        run: |
          set +e
          python scripts/github_siope_export_runtime_route_probe_gate.py > "$RUNNER_TEMP/siope_export_runtime_route_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-export-runtime-route-evidence
          if [ -s "$RUNNER_TEMP/siope_export_runtime_route_result.json" ]; then
            cp "$RUNNER_TEMP/siope_export_runtime_route_result.json" siope-export-runtime-route-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_EXPORT_RUNTIME_ROUTE_PROBE_NO_RESULT","candidate_route_network_sent":false,"response_body_captured":false,"request_body_captured":false,"request_headers_captured":false,"cookies_captured":false,"artifact_downloaded":false,"head_request_performed":false,"remote_writes":"NONE","collection_authorized":false,"processing_authorized":false,"recurrence_authorized":false,"schedule_enabled":false}' > siope-export-runtime-route-evidence/result.json
          fi

      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siope-export-runtime-route-probe-${{ github.run_id }}
          path: siope-export-runtime-route-evidence/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagar resultado do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-export-runtime-route-evidence/result.json
          code='${{ steps.runtime_gate.outputs.exit_code }}'
          if [ "${code:-24}" != "0" ]; then
            exit "${code:-24}"
          fi
          echo "PASS_M7_SIOPE_EXPORT_RUNTIME_ROUTE_PROBE_GATE"
