name: M8 SIOPE HISTORICAL PRODUCT OUTPUT PUBLICATION GATE
run-name: "M8 controlled SIOPE historical publication 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_m8_siope_historical_product_output_publication:
        description: "Confirmar publicação única autorizada: 1 Sheet + 1 PDF + 1 completion manifest em 08_OUTPUTS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: m8-siope-historical-product-output-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar M8 em 08_OUTPUTS
    if: ${{ inputs.confirm_m8_siope_historical_product_output_publication == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SOURCE_ARTIFACT_ID: "9684264254"

    steps:
      - name: Validar trust boundary manual antes de secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ferinbon-cpu/robo-dados-publicos"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          echo "PASS_M8_PUBLICATION_TRUST_BOUNDARY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight offline da candidata
        run: python scripts/github_preflight.py

      - name: Compilar
        run: python -m compileall -q .

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest

      - name: Baixar artefato T1 pinado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/m8-source.zip"
          test -s "$RUNNER_TEMP/m8-source.zip"
          echo "PINNED_ARTIFACT_DOWNLOADED"

      - name: Dry-run local sem Drive
        run: >-
          python scripts/publish_m8_siope_historical_product_output.py
          --artifact-zip "$RUNNER_TEMP/m8-source.zip"
          --owner-authorized
          --dry-run

      - name: Validar presença de credenciais OAuth write-capable
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          names = (
              'GOOGLE_DRIVE_CLIENT_ID',
              'GOOGLE_DRIVE_CLIENT_SECRET',
              'GOOGLE_DRIVE_REFRESH_TOKEN',
          )
          missing = [name for name in names if not os.getenv(name, '').strip()]
          if missing:
              print('STOP_M8_PUBLICATION_MISSING_WRITE_SECRETS: ' + ', '.join(missing))
              sys.exit(3)
          print('OAuth write secrets: PRESENTES (valores não exibidos)')
          PY

      - name: Publicação controlada de exatamente 3 objetos
        id: publication_gate
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set +e
          python scripts/publish_m8_siope_historical_product_output.py \
            --artifact-zip "$RUNNER_TEMP/m8-source.zip" \
            --owner-authorized \
            > "$RUNNER_TEMP/m8_publication_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p m8-publication-evidence
          if [ -s "$RUNNER_TEMP/m8_publication_result.json" ]; then
            cp "$RUNNER_TEMP/m8_publication_result.json" m8-publication-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M8_SIOPE_HISTORICAL_PRODUCT_OUTPUT_PUBLICATION_NO_RESULT","remote_identifiers_exposed":false,"secret_values_exposed":false,"future_batch_execution_authorized":false}' > m8-publication-evidence/result.json
          fi

      - name: Publicar evidência do gate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m8-siope-historical-publication-${{ github.run_id }}
          path: m8-publication-evidence/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagar resultado do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat m8-publication-evidence/result.json
          code='${{ steps.publication_gate.outputs.exit_code }}'
          if [ "${code:-16}" != "0" ]; then
            exit "${code:-16}"
          fi
          echo "PASS_M8_SIOPE_HISTORICAL_PRODUCT_OUTPUT_PUBLICATION_GATE"
