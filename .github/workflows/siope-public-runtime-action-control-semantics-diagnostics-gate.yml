name: M7 SIOPE PUBLIC RUNTIME ACTION CONTROL SEMANTICS DIAGNOSTICS GATE
run-name: "M7 SIOPE public runtime action control semantics 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_public_runtime_action_control_semantics_diagnostics:
        description: "Confirmar observação passiva booleana do hidden acao; sem valores, interação, mutação ou submit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.confirm_public_runtime_action_control_semantics_diagnostics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_siope_runtime_dependency_preflight.py
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_public_runtime_route_contract_review_gate.py
      - run: python scripts/github_siope_public_runtime_control_interaction_diagnostics_design_gate.py
      - run: python scripts/github_siope_public_runtime_control_inventory_review_gate.py
      - run: python scripts/github_siope_public_runtime_control_value_consistency_diagnostics_design_gate.py
      - run: python scripts/github_siope_public_runtime_control_value_consistency_diagnostics_gate.py --dry-run
      - run: python scripts/github_siope_public_runtime_control_value_consistency_review_gate.py
      - run: python scripts/github_siope_public_runtime_action_control_semantics_diagnostics_design_gate.py
      - run: python scripts/github_siope_public_runtime_action_control_semantics_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Observar relações booleanas do hidden acao
        id: live
        continue-on-error: true
        run: python scripts/github_siope_public_runtime_action_control_semantics_diagnostics_gate.py --output siope-public-runtime-action-control-semantics-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-public-runtime-action-control-semantics-${{ github.run_id }}
          path: siope-public-runtime-action-control-semantics-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
