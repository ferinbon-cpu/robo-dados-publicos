name: M7 SIOPE ARTIFACT METADATA ROUTE VERIFICATION GATE
run-name: "M7 SIOPE artifact metadata route verification 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_artifact_metadata_route_verification:
        description: "Confirmar um GET somente-leitura para a rota exata de metadata observada no probe V2, sem chamar qualquer rota de download"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: robo-dados-publicos-siope-artifact-metadata-route-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar endpoint de metadata do artefato SIOPE
    if: ${{ inputs.confirm_artifact_metadata_route_verification == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight offline da candidata
        run: python scripts/github_preflight.py

      - name: Gate M7 de desenho da expansão
        run: python scripts/github_source_expansion_design_gate.py

      - name: Dry-run da verificação de metadata sem rede
        run: python scripts/github_siope_artifact_metadata_route_verification_gate.py --dry-run

      - name: Compilar
        run: python -m compileall -q .

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest

      - name: Verificação ao vivo do endpoint exato de metadata
        id: metadata_gate
        shell: bash
        run: |
          set +e
          python scripts/github_siope_artifact_metadata_route_verification_gate.py > "$RUNNER_TEMP/siope_artifact_metadata_route_verification_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-artifact-metadata-route-verification-evidence
          if [ -s "$RUNNER_TEMP/siope_artifact_metadata_route_verification_result.json" ]; then
            cp "$RUNNER_TEMP/siope_artifact_metadata_route_verification_result.json" siope-artifact-metadata-route-verification-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_ARTIFACT_METADATA_ROUTE_VERIFICATION_NO_RESULT","raw_metadata_persisted":false,"response_body_persisted":false,"query_values_persisted":false,"request_headers_persisted":false,"cookies_persisted":false,"download_candidate_requested":false,"artifact_downloaded":false,"head_request_performed":false,"remote_writes":"NONE","collection_authorized":false,"processing_authorized":false,"recurrence_authorized":false,"schedule_enabled":false}' > siope-artifact-metadata-route-verification-evidence/result.json
          fi

      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siope-artifact-metadata-route-verification-${{ github.run_id }}
          path: siope-artifact-metadata-route-verification-evidence/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagar resultado do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-artifact-metadata-route-verification-evidence/result.json
          code='${{ steps.metadata_gate.outputs.exit_code }}'
          if [ "${code:-28}" != "0" ]; then
            exit "${code:-28}"
          fi
          echo "PASS_M7_SIOPE_ARTIFACT_METADATA_ROUTE_VERIFICATION_GATE"
