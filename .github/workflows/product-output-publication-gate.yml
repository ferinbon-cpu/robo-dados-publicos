name: M6 PRODUCT OUTPUT PUBLICATION GATE
run-name: "M6 controlled product output 0.7.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_product_publication:
        description: "Confirmar gate único: criar 1 Google Sheet + 1 PDF + 1 manifesto em 08_OUTPUTS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: robo-dados-publicos-product-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar saída controlada
    if: ${{ inputs.confirm_product_publication == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validar presença de credenciais OAuth
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          names = (
              'GOOGLE_DRIVE_CLIENT_ID',
              'GOOGLE_DRIVE_CLIENT_SECRET',
              'GOOGLE_DRIVE_REFRESH_TOKEN',
          )
          missing = [name for name in names if not os.getenv(name, '').strip()]
          if missing:
              print('STOP_MISSING_GITHUB_SECRETS: ' + ', '.join(missing))
              sys.exit(3)
          print('OAuth secrets: PRESENTES (valores não exibidos)')
          PY

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Preflight offline da candidata
        run: python scripts/github_preflight.py

      - name: Compilar
        run: python -m compileall -q .

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Regressão histórica
        run: python main.py selftest

      - name: Dry-run do gate sem rede
        run: python scripts/github_product_publication_gate.py --dry-run

      - name: Publicação controlada
        id: publication_gate
        shell: bash
        run: |
          set +e
          python scripts/github_product_publication_gate.py > "$RUNNER_TEMP/product_publication_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p publication-gate-evidence
          if [ -s "$RUNNER_TEMP/product_publication_result.json" ]; then
            cp "$RUNNER_TEMP/product_publication_result.json" publication-gate-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_PRODUCT_PUBLICATION_NO_RESULT","remote_identifiers_exposed":false,"secret_values_exposed":false}' > publication-gate-evidence/result.json
          fi

      - name: Publicar evidência do gate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-publication-gate-${{ github.run_id }}
          path: publication-gate-evidence/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagar resultado do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat publication-gate-evidence/result.json
          code='${{ steps.publication_gate.outputs.exit_code }}'
          if [ "${code:-16}" != "0" ]; then
            exit "${code:-16}"
          fi
          echo "PASS_M6_PRODUCT_OUTPUT_PUBLICATION_GATE"
