name: TASK 219D temporary offline bidding canonization
run-name: "TASK 219D bidding canonization by @${{ github.actor }}"

on:
  push:
    branches:
      - task-219d-jom-bidding-identity-canonization
    paths:
      - 'runtime_triggers/task219d_canonize.run'

permissions:
  contents: write
  actions: read

concurrency:
  group: task-219d-bidding-canonization
  cancel-in-progress: false

jobs:
  canonize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Download exact TASK 219A artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime_in
          mkdir -p runtime_in
          gh run download 34354027245 \
            --repo ferinbon-cpu/robo-dados-publicos \
            --name task-219a-jom-general-events-sanitized \
            --dir runtime_in
          test -f runtime_in/task219a_events_gold_sanitized.jsonl

      - name: Canonize bidding identities
        shell: bash
        run: |
          set -euo pipefail
          python -m robo_dados_publicos.research.task219d_jom_bidding_identity_canonization runtime_in
          python -m unittest tests.test_task_219d_jom_bidding_identity_canonization -v

      - name: Commit generated canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/evidence/fixtures/task219/TASK_219D_NEW_87_BIDDING_IDENTITY_ANCHORS.jsonl \
            docs/evidence/fixtures/task219/TASK_219D_FULL_99_EDITION_BIDDING_IDENTITY_INDEX.json \
            docs/evidence/fixtures/task219/TASK_219D_EDITAL_PNCP_DAILY_SEARCH_SEEDS.json \
            docs/evidence/TASK_219D_JOM_BIDDING_IDENTITY_CANONIZATION_0.8.0.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "TASK 219D: materialize canonical bidding identities"
          git push origin HEAD:task-219d-jom-bidding-identity-canonization
