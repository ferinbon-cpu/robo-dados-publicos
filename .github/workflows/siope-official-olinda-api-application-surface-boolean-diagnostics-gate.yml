name: M7 SIOPE OFFICIAL OLINDA APPLICATION SURFACE BOOLEAN DIAGNOSTICS GATE
run-name: "M7 SIOPE official Olinda application surface boolean diagnostics 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_official_olinda_application_surface_boolean_diagnostics:
        description: "Confirmar diagnóstico booleano passivo da superfície Olinda; rotas não aprovadas são bloqueadas antes da rede"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.confirm_official_olinda_application_surface_boolean_diagnostics == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - run: python scripts/github_source_expansion_design_gate.py
      - run: python scripts/github_siope_public_runtime_route_contract_review_gate.py
      - run: python scripts/github_siope_public_runtime_query_equivalence_partition_design_gate.py
      - run: python scripts/github_siope_public_indexed_get_second_example_discovery_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_discovery_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_service_discovery_gate.py --dry-run
      - run: python scripts/github_siope_official_olinda_api_service_discovery_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_resource_contract_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_runtime_route_diagnostics_design_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_runtime_route_diagnostics_gate.py --dry-run
      - run: python scripts/github_siope_official_olinda_api_application_runtime_route_diagnostics_review_gate.py
      - run: python scripts/github_siope_official_olinda_api_application_surface_boolean_diagnostics_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Diagnosticar booleanos da superfície oficial Olinda
        id: live
        continue-on-error: true
        run: python scripts/github_siope_official_olinda_api_application_surface_boolean_diagnostics_gate.py --output siope-official-olinda-application-surface-boolean-diagnostics-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-official-olinda-application-surface-boolean-diagnostics-${{ github.run_id }}
          path: siope-official-olinda-application-surface-boolean-diagnostics-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
