name: M7 SIOPE CLIENT LIMEIRA LIVE VALIDATION GATE
run-name: "M7 SIOPE client Limeira live validation 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_live_validation:
        description: "Confirmar exatamente um GET público de Limeira pelo SiopeClient genérico; sem retry, redirect, paginação, persistência de registros ou recorrência"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.confirm_siope_client_limeira_live_validation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/github_preflight.py
      - name: Revisar evidência pinada do piloto Limeira
        run: python scripts/github_siope_official_olinda_limeira_pilot_readonly_get_review_gate.py
      - name: Validar fundação do SiopeClient sem rede
        run: python scripts/github_siope_client_foundation_design_gate.py
      - name: Validar desenho do uso live do cliente sem rede
        run: python scripts/github_siope_client_limeira_live_validation_gate.py --dry-run
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python main.py selftest
      - name: Executar um único GET Limeira pelo SiopeClient
        id: live
        continue-on-error: true
        run: python scripts/github_siope_client_limeira_live_validation_gate.py --output siope-client-limeira-live-validation-evidence/result.json
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: siope-client-limeira-live-validation-${{ github.run_id }}
          path: siope-client-limeira-live-validation-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ steps.live.outcome == 'failure' }}
        run: exit 1
