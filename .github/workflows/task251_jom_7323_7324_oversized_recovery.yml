name: TASK 251 JOM 7323-7324 oversized recovery

on:
  push:
    branches:
      - task-251-jom-7323-7324-oversized-recovery-runtime
    paths:
      - runtime_triggers/task251_jom_7323_7324_oversized_recovery.run

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact runtime head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact one-shot authorization delta
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          AUTH=runtime/task251_owner_authorization.json
          test -f "$AUTH"
          IMPL="$(python - <<'PY'
          import json
          print(json.load(open("runtime/task251_owner_authorization.json", encoding="utf-8"))["implementation_sha"])
          PY
          )"
          test "$(printf '%s' "$IMPL" | grep -E '^[0-9a-f]{40}$')" = "$IMPL"
          git cat-file -e "$IMPL^{commit}"
          git merge-base --is-ancestor "$IMPL" HEAD
          UNEXPECTED="$(git diff --name-only "$IMPL"..HEAD | grep -Ev '^(runtime/task251_owner_authorization.json|runtime_triggers/task251_jom_7323_7324_oversized_recovery.run)$' || true)"
          test -z "$UNEXPECTED"
          echo "TASK251_IMPLEMENTATION_SHA=$IMPL" >> "$GITHUB_ENV"

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Execute exact authorized two-document oversized recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_out
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from robo_dados_publicos.research.task251_jom_7323_7324_oversized_recovery import (
              LiveExactPdfSource,
              execute,
              load_canonical_evidence,
              load_config,
          )

          cfg = load_config()
          evidence = load_canonical_evidence()
          auth = json.loads(Path("runtime/task251_owner_authorization.json").read_text(encoding="utf-8"))
          result = execute(
              cfg,
              evidence,
              source=LiveExactPdfSource(),
              authorization=auth,
              expected_implementation_sha=os.environ["TASK251_IMPLEMENTATION_SHA"],
              offline_test_mode=False,
          )
          canonical = json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          result["result_sha256"] = hashlib.sha256(canonical).hexdigest()
          target = Path("runtime_out/task251_sanitized_oversized_recovery.json")
          target.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("TASK251_STATUS=" + str(result.get("status")))
          print("TASK251_SOURCE_GETS=" + str(result.get("source_gets")))
          print("TASK251_DRIVE_WRITES=" + str(result.get("drive_write_count")))
          print("TASK251_RAW_PDF_PERSISTED=" + str(result.get("raw_pdf_persisted")))
          if result.get("status") != "PASS_TASK251_BOUNDED_OVERSIZED_RECOVERY":
              raise SystemExit(2)
          PY

      - name: Verify sanitized-only persistence
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime_out/task251_sanitized_oversized_recovery.json
          test "$(find runtime_out -type f | wc -l)" -eq 1
          test -z "$(find runtime_out -type f -name '*.pdf' -print)"

      - name: Upload sanitized recovery only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-251-jom-7323-7324-oversized-recovery-sanitized
          path: runtime_out/task251_sanitized_oversized_recovery.json
          if-no-files-found: error
          retention-days: 1
