name: DIAG DOM SYNTAX SUCCESS RUN 2
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest exact manual run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          workflow = 'siope-official-olinda-api-application-dom-syntax-skeleton-diagnostics-gate.yml'
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'diag-dom-syntax-success-run-2',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          runs = get(f'{base}/actions/workflows/{workflow}/runs?branch=main&event=workflow_dispatch&per_page=5')['workflow_runs']
          if not runs:
              raise SystemExit('NO_MANUAL_RUN')
          run = runs[0]
          jobs = get(f'{base}/actions/runs/{run["id"]}/jobs?per_page=10')['jobs']
          arts = get(f'{base}/actions/runs/{run["id"]}/artifacts?per_page=10')['artifacts']
          out = {
              'run_id': run['id'],
              'run_number': run['run_number'],
              'event': run['event'],
              'head_branch': run['head_branch'],
              'head_sha': run['head_sha'],
              'status': run['status'],
              'conclusion': run['conclusion'],
              'created_at': run['created_at'],
              'updated_at': run['updated_at'],
              'jobs': [{'id': j['id'], 'name': j['name'], 'status': j['status'], 'conclusion': j['conclusion']} for j in jobs],
              'artifacts': [{'id': a['id'], 'name': a['name'], 'size_in_bytes': a['size_in_bytes'], 'expired': a['expired'], 'digest': a.get('digest')} for a in arts],
          }
          print(json.dumps(out, sort_keys=True))
          if run['event'] != 'workflow_dispatch' or run['head_branch'] != 'main' or run['status'] != 'completed':
              raise SystemExit('RUN_IDENTITY_NOT_READY')
          PY