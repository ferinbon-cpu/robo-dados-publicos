name: M7 SIOPE CLIENT LIMEIRA SILVER SINGLE RECORD TRANSFORM PREVIEW GATE
run-name: "M7 SIOPE client Limeira Silver single record transform preview 0.8.0 by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      confirm_siope_client_limeira_silver_single_record_transform_preview:
        description: "Confirmar preview local lossless do primeiro Silver SIOPE; sem Drive, sem novo GET SIOPE, sem persistência Silver/Gold ou recorrência"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-client-limeira-silver-single-record-transform-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.confirm_siope_client_limeira_silver_single_record_transform_preview == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preflight offline
        run: python scripts/github_preflight.py
      - name: Revisar readback Bronze pinado
        run: python scripts/github_siope_client_limeira_bronze_drive_readback_review_gate.py
      - name: Validar desenho Silver sem rede nem writes
        run: python scripts/github_siope_client_limeira_silver_single_record_transform_preview_gate.py --dry-run
      - name: Compilar
        run: python -m compileall -q .
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Regressão histórica
        run: python main.py selftest
      - name: Executar preview lossless local
        id: preview
        shell: bash
        run: |
          set +e
          python scripts/github_siope_client_limeira_silver_single_record_transform_preview_gate.py > "$RUNNER_TEMP/siope_silver_preview_result.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preparar evidência sanitizada
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p siope-client-limeira-silver-single-record-transform-preview-evidence
          if [ -s "$RUNNER_TEMP/siope_silver_preview_result.json" ]; then
            cp "$RUNNER_TEMP/siope_silver_preview_result.json" siope-client-limeira-silver-single-record-transform-preview-evidence/result.json
          else
            printf '%s\n' '{"status":"STOP_M7_SIOPE_CLIENT_LIMEIRA_SILVER_SINGLE_RECORD_TRANSFORM_PREVIEW_NO_RESULT","drive_write_count":0,"silver_payload_persisted":false,"source_network_called":false}' > siope-client-limeira-silver-single-record-transform-preview-evidence/result.json
          fi
      - name: Publicar evidência sanitizada
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: siope-client-limeira-silver-single-record-transform-preview-${{ github.run_id }}
          path: siope-client-limeira-silver-single-record-transform-preview-evidence/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagar STOP do gate
        if: ${{ always() }}
        shell: bash
        run: |
          cat siope-client-limeira-silver-single-record-transform-preview-evidence/result.json
          code='${{ steps.preview.outputs.exit_code }}'
          if [ "${code:-22}" != "0" ]; then
            exit "${code:-22}"
          fi
          echo "PASS_M7_SIOPE_CLIENT_LIMEIRA_SILVER_SINGLE_RECORD_TRANSFORM_PREVIEW"
