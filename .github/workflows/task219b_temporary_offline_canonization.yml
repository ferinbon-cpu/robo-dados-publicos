name: TASK 219B temporary offline canonization
run-name: "TASK 219B canonize strong identities by @${{ github.actor }}"

on:
  push:
    branches:
      - task-219b-canonize-strong-identities
    paths:
      - 'runtime_triggers/task219b_canonize.run'

permissions:
  contents: write
  actions: read

concurrency:
  group: task-219b-canonize-strong-identities
  cancel-in-progress: false

jobs:
  canonize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Download exact TASK 219A artifact from exact run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime_in
          mkdir -p runtime_in
          gh run download 34354027245 \
            --repo ferinbon-cpu/robo-dados-publicos \
            --name task-219a-jom-general-events-sanitized \
            --dir runtime_in
          test "$(find runtime_in -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Canonize exact strong identities
        shell: bash
        run: |
          set -euo pipefail
          python -m robo_dados_publicos.research.task219b_jom_strong_identity_canonization runtime_in
          python -m unittest tests.test_task_219b_jom_strong_identity_canonization -v

      - name: Commit generated canonical evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/evidence/fixtures/task219/TASK_219B_NEW_87_STRONG_IDENTITY_ANCHORS.jsonl \
            docs/evidence/fixtures/task219/TASK_219B_FULL_99_EDITION_STRONG_IDENTITY_INDEX.json \
            docs/evidence/TASK_219B_FULL_2026_JOM_STRONG_IDENTITY_CANONIZATION_0.8.0.json
          test -n "$(git diff --cached --name-only)"
          git commit -m "TASK 219B: materialize canonical strong-identity evidence"
          git push origin HEAD:task-219b-canonize-strong-identities
